[pytest]
# Scenariusz E2E jest jeden i długi – logi kroków w konsoli są jedynym sensownym śladem,
# gdy coś padnie w połowie. Zrzuty ekranu i logi konsoli przeglądarki lądują w ``artifacts/``.
addopts = -ra -p no:cacheprovider
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %H:%M:%S
