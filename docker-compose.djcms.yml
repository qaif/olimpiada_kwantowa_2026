# Nakładka serwisu na django CMS (docs/tasks/DJ-01.md, DJ-02.md, docs/OPERACJE.md § 22). Włączana
# WYŁĄCZNIE przy DJCMS_ENABLED=1: scripts/deploy.sh dopisuje wtedy do .env serwera
#   COMPOSE_FILE=docker-compose.yml:docker-compose.djcms.yml
#   COMPOSE_PROFILES=djcms
# a docker compose czyta obie zmienne z .env sam – każde polecenie compose'a w katalogu instalacji
# (wdrożenie, scripts/backup.sh, ręczne `docker compose up -d proxy`) widzi tę nakładkę i usługę djcms.
#
# Dlaczego osobny plik, a nie montaż w docker-compose.yml (jak zakładała pierwsza wersja DJ-01 § 8.7):
# wpis w `proxy.volumes` pliku podstawowego zmieniałby `docker compose config` usługi `proxy` na KAŻDEJ
# instalacji, także tej, na której dj. nigdy nie włączono, i proxy byłoby odtwarzane przy najbliższym
# `up`. Kontrakt DJ-01 § 1.2 p. 9 jest odwrotny: bez przełącznika konfiguracja compose'a jest co do
# linijki ta, co przed DJ-01 (scripts/tests/compose_profiles_test.sh). Zmienna w ścieżce montażu nie
# pomaga – wpis istniałby zawsze, zmieniałaby się tylko jego wartość.
#
# Alternatywa odrzucona: pliki redaktorów podawane przez samego djcms (widok Django albo WhiteNoise).
# Widok `django.views.static.serve` jest wprost „nie do produkcji” (każdy plik przez gunicorna, 2×2
# wątki na cały serwis), a WhiteNoise indeksuje katalog przy starcie procesu – plik wgrany po starcie
# nie istniałby do restartu. Caddy podaje pliki sam, z nagłówkami z reguły 12 (CSP `sandbox`, nosniff).
#
# DJ-02: nakładka dokłada też **stały adres** `proxy` w sieci `internal` – djcms ufa nagłówkom
# `X-Real-IP` i `X-Djcms-Mode` (tryb preview/primary, od którego zależy noindex) wyłącznie od tego
# adresu (`TRUSTED_PROXY_IPS` usługi djcms w docker-compose.yml, ta sama zmienna DJCMS_PROXY_IP).
# Bez przypięcia djcms musiałby ufać całej podsieci, czyli także web, workerowi, minio, clamav,
# poczcie… Przypięcie tutaj, a nie w pliku podstawowym – z tego samego powodu co montaż wyżej:
# bez dj. konfiguracja `proxy` ma zostać ta, co przed DJ-01. Adres z końca puli (Docker przydziela
# dynamiczne od początku), zmiana tylko razem z DJCMS_PROXY_IP w .env.
services:
  proxy:
    volumes:
      # Pliki wgrane przez redaktorów djcms (filer) – tylko do odczytu; pisze do wolumenu wyłącznie
      # djcms. Każdy blok aplikacji w caddy/Caddyfile (scripts/render_caddyfile.sh)
      # podaje je pod /djcms/media/* (DJ-02 D2), z CSP `sandbox` poza PDF-em.
      - djcms_media:/srv/djcms-media:ro
    networks:
      edge:
      internal:
        ipv4_address: ${DJCMS_PROXY_IP:-172.30.2.250}
