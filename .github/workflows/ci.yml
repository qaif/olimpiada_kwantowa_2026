# Ciągła integracja: to samo, co przed wdrożeniem robi człowiek, tylko bez pamiętania o tym.
#
# Kolejność zadań jest treścią, a nie estetyką: `lint` trwa kilkanaście sekund i wyłapuje większość
# zwykłych pomyłek, `tests` trwa kilka minut, a `image` – najdłużej. Uruchamiamy je równolegle
# (żaden nie potrzebuje wyniku poprzedniego), ale to `lint` daje odpowiedź najszybciej i to na nim
# autor zmiany patrzy najpierw.
#
# Żaden krok nie wymaga sekretów **repozytorium**. Jest to warunek świadomy: workflow uruchamiany
# z forka nie dostaje sekretów, więc gdyby ich potrzebował, na zewnętrznych zgłoszeniach pokazywałby
# wyłącznie czerwony krzyżyk i nikt by z niego nic nie miał. Jedyny wyjątek jest pozorny: publikacja
# obrazu do GHCR używa wbudowanego `GITHUB_TOKEN` (żaden sekret nie jest zakładany ręcznie) i włącza
# się **wyłącznie** dla `main` i znaczników `v*`, czyli nigdy dla pull requesta – także własnego.
# Zgłoszenie z forka nadal buduje obraz, tylko go nigdzie nie wypycha.
name: CI

on:
  push:
    branches: [main]
    # Znaczniki wydań: obraz publikowany pod nazwą wersji powstaje właśnie tutaj
    # (zadanie `image`, docs/UNIWERSALNY-ETAP-2.md § 1.7.2). Bez tego wiersza `git push --tags`
    # nie uruchamiałby CI w ogóle, więc `v0.24.0` nie miałoby skąd wziąć obrazu.
    tags: ["v*"]
  pull_request:

# Nowy push do tej samej gałęzi przerywa poprzedni przebieg: wynik dla kodu sprzed dwóch minut
# nikogo już nie interesuje, a minuty maszyny są wspólne.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ta sama wersja, co w obrazie (backend/Dockerfile, `requires-python = ">=3.12"`). Testy
  # przechodzące na innej wersji niż produkcja niczego o produkcji nie dowodzą.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: ruff (styl i importy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Klucz cache'u po pliku zależności: przebieg, który niczego nie zmienił w zależnościach,
          # nie ma powodu ich ponownie pobierać.
          cache-dependency-glob: backend/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja narzędzi
        working-directory: backend
        run: uv pip install --system -r pyproject.toml --extra dev

      # Dwa wywołania, a nie jedno: `check` szuka błędów, `format --check` pilnuje zapisu.
      # Rozdzielone, bo ich naprawa jest inna – pierwsze poprawia człowiek, drugie `ruff format`.
      - name: ruff check
        working-directory: backend
        run: ruff check apps ../e2e config

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check apps config

  migrations:
    name: makemigrations --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja zależności
        working-directory: backend
        run: uv pip install --system -r pyproject.toml --extra dev

      # Osobne zadanie, choć technicznie mogłoby wisieć przy testach. Powód: brakująca migracja
      # jest awarią **wdrożenia**, a nie testów – produkcja wstaje wtedy z bazą niezgodną z kodem
      # i wywraca się przy pierwszym zapytaniu. Osobne zadanie mówi to wprost nazwą.
      #
      # `--check --dry-run` niczego nie zapisuje i nie łączy się z bazą: Django porównuje modele
      # z plikami migracji, więc żadna usługa nie jest tu potrzebna.
      - name: Czy modele mają komplet migracji
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

  translations:
    name: msgfmt (tłumaczenia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `msgfmt` nie jest częścią obrazu `ubuntu-latest` – w `backend/Dockerfile` przychodzi razem
      # z pakietem `gettext` (warstwa runtime), tutaj trzeba go doinstalować jawnie. Bez tego kroku
      # polecenie niżej kończy się kodem 127 („command not found”), co wygląda jak błąd w plikach
      # tłumaczeń, a jest wyłącznie brakiem narzędzia na goszczącym runnerze.
      - name: Instalacja gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      # Ten sam krok, co w `backend/Dockerfile` – i to jest jedyny powód jego istnienia tutaj.
      # Błąd składni w katalogu tłumaczeń wywraca **budowanie obrazu**, czyli wychodzi dopiero
      # przy wdrożeniu. Tutaj wychodzi przy zgłoszeniu zmiany, kosztem dziesięciu sekund.
      - name: Sprawdzenie katalogów tłumaczeń
        working-directory: backend
        run: |
          set -eu
          for po in locale/*/LC_MESSAGES/django.po; do
            [ -e "$po" ] || continue
            echo "== $po"
            msgfmt --check --output-file=/dev/null "$po"
          done

  tests:
    # ~4700 testów w jednym przebiegu trwało 27–32 minuty – dłużej niż `lint`, `migrations`
    # i `image` razem wzięte, i to ich autor czekał najdłużej na czerwony/zielony wynik.
    # `pytest-split` dzieli zbiór testów na tyle części, ile wpisów ma `matrix.shard` niżej (dziś
    # pięć). Każdy shard dostaje **własny** kontener Postgresa (blok `services` jest per-job, więc
    # matrix mnoży go razem z resztą joba), więc bazy się nie ścigają i nie trzeba nikomu nadawać
    # osobnej nazwy.
    #
    # Podział jest po **zmierzonym czasie**, nie po liczbie testów: `backend/.test_durations`
    # niesie czas każdego testu, a `--splitting-algorithm least_duration` rozkłada testy tak, żeby
    # shardy kończyły mniej więcej razem. Podział po liczbie dawał shardy od 2 do 17 minut, bo
    # testy PDF-ów, pieczęci elektronicznej i cofania migracji ważą wielokrotnie więcej niż reszta
    # i stoją obok siebie. Test, którego w pliku nie ma (nowy), dostaje czas średni – plik nie
    # musi więc być aktualny co do testu, wystarczy odświeżyć go, gdy shardy znów się rozjadą:
    # pełny przebieg z wtyczką zapisującą czasy (opis w `docs/OPERACJE.md`, § CI).
    name: "pytest (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    strategy:
      # `fail-fast: false` celowo: shard nr 2 czerwony nie ma ukrywać, że nr 5 też jest czerwony –
      # autor zmiany ma dostać komplet informacji z jednego przebiegu, a nie odkrywać drugą awarię
      # dopiero po naprawieniu pierwszej i ponownym pushu.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    services:
      # Postgres jest jedyną usługą, bez której testy nie ruszą: `config/settings/test.py`
      # podmienia cache na lokalny, magazyn plików na dyskowy, a Celery na tryb `eager`, ale bazy
      # podmienić się nie da – zapytania i migracje są przedmiotem połowy tych testów.
      #
      # Redisa i MinIO **nie ma** tutaj świadomie: w ustawieniach testowych nic ich nie dotyka
      # (`CACHES` = locmem, `SUBMISSION_STORAGE_BACKEND` = lokalny), więc byłyby dwiema usługami,
      # które wydłużają każdy przebieg i dokładają własne tryby awarii, nie sprawdzając niczego.
      # Gdyby któryś test miał kiedyś naprawdę pukać w Redisa, wróci tu razem z nim.
      #
      # `S3_*`/`MINIO_*` niżej to inna sprawa – nie jest to usługa, tylko **poświadczenia**, których
      # potrzebuje kilka testów offline (patrz `env` joba).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: olimpiada
          POSTGRES_USER: olimpiada
          POSTGRES_PASSWORD: olimpiada
        ports: ["5432:5432"]
        # Bez `health-cmd` krok testów startuje, zanim Postgres przyjmie pierwsze połączenie,
        # i przewraca się losowo – raz na kilka przebiegów, czyli najgorszym możliwym rytmem.
        options: >-
          --health-cmd "pg_isready -U olimpiada -d olimpiada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Wszystko przez zmienne środowiskowe, bez pliku .env: to jest ten sam kontrakt, co
      # w compose (`x-app-env`), więc konfiguracja CI nie może rozjechać się z produkcyjną.
      DATABASE_URL: postgres://olimpiada:olimpiada@localhost:5432/olimpiada
      # ≥ 50 znaków – `config/settings/production.py` odmawia startu poniżej tego progu.
      # `apps/submissions/tests/test_bucket_credentials.py` przeładowuje ten moduł ustawień
      # wprost (klucze storage czyta się przy imporcie, nie da się ich podmienić
      # `override_settings`), więc ten sam próg obowiązuje w teście, a nie tylko na produkcji.
      DJANGO_SECRET_KEY: ci-tylko-do-testow-nie-uzywac-nigdzie-indziej-minimum-50-znakow
      DJANGO_SETTINGS_MODULE: config.settings.test
      # E2E_MODE **musi** zostać wyłączone: ustawione zeruje próg antyspamowy i włącza tryb
      # testowy CAPTCHY, więc testy tych dwóch zabezpieczeń przestałyby cokolwiek sprawdzać –
      # i nie powiedziałyby o tym ani słowa.
      E2E_MODE: "0"
      # Poświadczenia MinIO – lokalnie dają je compose i `.env` (patrz `.env.example`), tutaj nie
      # ma ani jednego, ani drugiego. Testy nie dotykają prawdziwego S3 (`config/settings/test.py`
      # ustawia lokalny storage rozwiązań), ale kilka z nich **podpisuje** presigned URL offline
      # (`apps/submissions/tests/test_critic_fixes.py`, `test_download_privacy.py`) albo
      # przeładowuje `config/settings/production.py`, gdzie klucze wchodzą do konfiguracji S3
      # (`test_bucket_credentials.py`) – bez nich boto3 kończy podpisywanie
      # `NoCredentialsError`em, zanim dojdzie do jakiegokolwiek zapytania sieciowego. Wartości są
      # fałszywkami takimi jak w `.env.example` – nic tu naprawdę nie łączy się z MinIO.
      MINIO_ROOT_USER: ci-minio-root
      MINIO_ROOT_PASSWORD: ci-minio-root-haslo-testowe
      S3_PUBLIC_ACCESS_KEY: ci-public-access-key
      S3_PUBLIC_SECRET_KEY: ci-public-secret-key-testowy
      S3_PRIVATE_ACCESS_KEY: ci-private-access-key
      S3_PRIVATE_SECRET_KEY: ci-private-secret-key-testowy

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja zależności
        working-directory: backend
        run: uv pip install --system -r pyproject.toml --extra dev

      # `backend/Dockerfile` kompiluje katalogi tłumaczeń przy budowaniu obrazu (`gettext` jest
      # w warstwie runtime); tutaj testy odpalają się bez obrazu, więc bez tego kroku katalog
      # angielski zostaje wyłącznie źródłem (`.po`) i Django cicho oddaje polskie napisy –
      # dokładnie to sprawdzają `apps/accounts/tests/test_mail_language.py` i
      # `apps/web/tests/test_preferences_i18n.py`.
      - name: Instalacja gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Kompilacja katalogów tłumaczeń
        working-directory: backend
        run: |
          set -eu
          for po in locale/*/LC_MESSAGES/django.po; do
            [ -e "$po" ] || continue
            msgfmt -o "${po%.po}.mo" "$po"
          done

      # WhiteNoise w trybie bez finderów (`WHITENOISE_USE_FINDERS = DEBUG`, a `DEBUG=False` w
      # testach) serwuje pliki wyłącznie z `STATIC_ROOT` – czyli z tego, co zostawił
      # `collectstatic`. W obrazie robi to `entrypoint.sh` przy starcie kontenera; tutaj nikt tego
      # nie wołał, więc `apps/web/tests/test_ui_system.py::test_stylesheet_is_served` (i każdy
      # inny test czytający `/static/...`) dostawał 404 na pusty katalog.
      - name: collectstatic
        working-directory: backend
        run: python manage.py collectstatic --noinput

      - name: pytest
        working-directory: backend
        run: >-
          python -m pytest -q --create-db --durations=20
          --splits ${{ strategy.job-total }} --group ${{ matrix.shard }}
          --splitting-algorithm least_duration

  pytest-ok:
    # Jeden wymagany check zamiast pięciu (nazwy shardów zmieniają się z liczbą shardów w matrixie,
    # więc nie nadają się na regułę ochrony gałęzi). `if: always()` musi tu być: bez niego ten job
    # w ogóle by się nie uruchomił, gdyby któryś shard padł – a wtedy `needs.tests.result` nigdy nie
    # przyjąłby wartości `failure`, tylko cały workflow zatrzymałby się bez tego joba,
    # czyli bez czytelnej, jednej odpowiedzi „testy przeszły / nie przeszły”.
    name: pytest (wynik zbiorczy)
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()
    steps:
      - name: Czy wszystkie shardy przeszły
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Co najmniej jeden shard pytest nie przeszedł (wynik: ${{ needs.tests.result }})."
            exit 1
          fi

  image:
    name: docker build (+ GHCR dla main i v*)
    runs-on: ubuntu-latest
    # `packages: write` wyłącznie tutaj i wyłącznie po to, żeby wypchnąć obraz do GHCR wbudowanym
    # `GITHUB_TOKEN`-em. `contents: read` wpisane jawnie, bo podanie jednego uprawnienia zeruje
    # pozostałe – bez tej linijki `actions/checkout` nie miałby czym sklonować repozytorium.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Kto publikuje, a kto tylko buduje – jedno miejsce, z którego biorą się i tagi, i decyzja.
      # Wartości z kontekstu `github` wchodzą tu przez zmienne środowiskowe, a nie przez `${{ }}`
      # w treści polecenia: nazwa gałęzi jest tekstem od autora zgłoszenia, więc wklejona wprost
      # do skryptu byłaby wstrzyknięciem poleceń do powłoki biegnącej z tokenem tego zadania.
      - name: Tagi obrazu i decyzja o publikacji
        id: obraz
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # Nazwa pakietu w GHCR musi być małymi literami, a nazwa organizacji na GitHubie nie musi.
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/olimpiada-web"
          short="$(printf '%s' "$SHA" | cut -c1-7)"
          case "$REF" in
            # Wydanie: obraz pod nazwą wersji. To jest tag, który wpisuje się w WEB_IMAGE
            # na serwerze (scripts/deploy.sh, README § 3).
            refs/tags/v*)    push=true;  tags="$image:$REF_NAME,$image:sha-$short" ;;
            # `main`: obraz „to, co na głównej” – do stagingu i do świeżej instalacji z paczki,
            # zanim powstanie kolejny znacznik.
            refs/heads/main) push=true;  tags="$image:main,$image:sha-$short" ;;
            # Pull request (także z forka): buduje się, nie publikuje. Tag jest wymagany przez
            # akcję nawet przy `push: false`, więc podajemy jeden, lokalny.
            *)               push=false; tags="$image:pr" ;;
          esac
          {
            echo "push=$push"
            echo "tags=$tags"
            echo "source=https://github.com/$REPO"
            echo "version=$REF_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "publikacja=$push, tagi=$tags"

      - name: Logowanie do GHCR
        if: steps.obraz.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Budowanie ma sens także bez publikacji i to jest jego pierwsze zadanie: obraz musi dać się
      # zbudować, zanim ktoś odpali `scripts/deploy.sh`, bo tam buduje się go na serwerze
      # produkcyjnym – nieudane budowanie zostawia serwis na starej wersji w połowie wdrożenia.
      # Ten krok wyłapuje przy okazji rzeczy, których nie widzi pytest: brakującą zależność
      # systemową i błąd w katalogu tłumaczeń (Dockerfile woła `msgfmt`).
      #
      # Publikacja (`main`, `v*`) dokłada do tego obraz, którym da się postawić instalację bez
      # kompilatora na serwerze: `WEB_IMAGE=ghcr.io/…` w .env albo w wywołaniu wdrożenia.
      # Nie publikujemy osobnych obrazów `worker` i `beat` – to ten sam obraz z innym poleceniem
      # (docker-compose.yml, `x-app-base`). Obrazów nie podpisujemy (cosign to osobna pozycja).
      - name: Budowanie obrazu produkcyjnego
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: ${{ steps.obraz.outputs.push }}
          tags: ${{ steps.obraz.outputs.tags }}
          # Etykiety OCI: bez `image.source` GHCR nie wie, do którego repozytorium należy pakiet,
          # i nie pokazuje przy nim ani kodu, ani licencji.
          labels: |
            org.opencontainers.image.source=${{ steps.obraz.outputs.source }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.obraz.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          # Cache warstw w cache'u Actions – bez niego każdy przebieg instaluje zależności od zera.
          cache-from: type=gha
          cache-to: type=gha,mode=max
