# Ciągła integracja: to samo, co przed wdrożeniem robi człowiek, tylko bez pamiętania o tym.
#
# Kolejność zadań jest treścią, a nie estetyką: `lint` trwa kilkanaście sekund i wyłapuje większość
# zwykłych pomyłek, `tests` trwa kilka minut, a `image` – najdłużej. Uruchamiamy je równolegle
# (żaden nie potrzebuje wyniku poprzedniego), ale to `lint` daje odpowiedź najszybciej i to na nim
# autor zmiany patrzy najpierw.
#
# Żaden krok nie wymaga sekretów **repozytorium**. Jest to warunek świadomy: workflow uruchamiany
# z forka nie dostaje sekretów, więc gdyby ich potrzebował, na zewnętrznych zgłoszeniach pokazywałby
# wyłącznie czerwony krzyżyk i nikt by z niego nic nie miał. Jedyny wyjątek jest pozorny: publikacja
# obrazu do GHCR używa wbudowanego `GITHUB_TOKEN` (żaden sekret nie jest zakładany ręcznie) i włącza
# się **wyłącznie** dla `main` i znaczników `v*`, czyli nigdy dla pull requesta – także własnego.
# Zgłoszenie z forka nadal buduje obraz, tylko go nigdzie nie wypycha.
name: CI

on:
  push:
    branches: [main]
    # Znaczniki wydań: obraz publikowany pod nazwą wersji powstaje właśnie tutaj
    # (zadanie `image`, docs/UNIWERSALNY-ETAP-2.md § 1.7.2). Bez tego wiersza `git push --tags`
    # nie uruchamiałby CI w ogóle, więc `v0.24.0` nie miałoby skąd wziąć obrazu.
    tags: ["v*"]
  pull_request:

# Nowy push do tej samej gałęzi przerywa poprzedni przebieg: wynik dla kodu sprzed dwóch minut
# nikogo już nie interesuje, a minuty maszyny są wspólne.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Domyślnie token przebiegu tylko czyta repozytorium (SEC-02). Joby, które potrzebują więcej
# (`image` – GHCR, `image-scan` – code scanning), dopisują to u siebie, jawnie i wąsko.
permissions:
  contents: read

env:
  # Ta sama wersja, co w obrazie (backend/Dockerfile, `requires-python = ">=3.14"`). Testy
  # przechodzące na innej wersji niż produkcja niczego o produkcji nie dowodzą.
  PYTHON_VERSION: "3.14"
  # Skanery (SEC-02, docs/OPERACJE.md § 47). Wersje przypięte, bo narzędzie bezpieczeństwa też jest
  # zależnością: Trivy w marcu 2026 r. wydał złośliwe 0.69.4 po przejęciu konta wydawniczego –
  # „najnowsza” to dokładnie ta wersja, której nie chcemy brać w dniu wydania. Podbicie = zmiana
  # tutaj (i w .github/workflows/security-scan.yml), po kilku dniach od wydania.
  TRIVY_VERSION: v0.74.0
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  lint:
    name: ruff (styl i importy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # Klucz cache'u po pliku zależności: przebieg, który niczego nie zmienił w zależnościach,
          # nie ma powodu ich ponownie pobierać.
          cache-dependency-glob: backend/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja narzędzi
        working-directory: backend
        run: uv pip install --system -r pyproject.toml --extra dev

      # Dwa wywołania, a nie jedno: `check` szuka błędów, `format --check` pilnuje zapisu.
      # Rozdzielone, bo ich naprawa jest inna – pierwsze poprawia człowiek, drugie `ruff format`.
      - name: ruff check
        working-directory: backend
        run: ruff check apps ../e2e ../scripts/security config

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check apps config ../scripts/security

  migrations:
    name: makemigrations --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja zależności
        working-directory: backend
        run: uv pip install --system -r pyproject.toml --extra dev

      # Osobne zadanie, choć technicznie mogłoby wisieć przy testach. Powód: brakująca migracja
      # jest awarią **wdrożenia**, a nie testów – produkcja wstaje wtedy z bazą niezgodną z kodem
      # i wywraca się przy pierwszym zapytaniu. Osobne zadanie mówi to wprost nazwą.
      #
      # `--check --dry-run` niczego nie zapisuje i nie łączy się z bazą: Django porównuje modele
      # z plikami migracji, więc żadna usługa nie jest tu potrzebna.
      - name: Czy modele mają komplet migracji
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

  djcms-routes:
    name: djcms_routes --check (kontrakt tras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja zależności
        working-directory: backend
        run: uv pip install --system -r pyproject.toml --extra dev

      # Pliki `backend/djcms_contract/app_routes.{json,env}` mówią Caddy'emu i djcms, które adresy
      # należą do aplikacji (docs/tasks/DJ-02.md § 6). Nowy ekran bez `djcms_routes --write` to
      # adres, który po przełączeniu na django CMS trafiłby do djcms – czyli awaria widoczna
      # dopiero na produkcji. Tak jak `makemigrations --check`: bez bazy, sam urlconf.
      - name: Czy pliki kontraktu tras są aktualne
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py djcms_routes --check

  translations:
    name: msgfmt (tłumaczenia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `msgfmt` nie jest częścią obrazu `ubuntu-latest` – w `backend/Dockerfile` przychodzi razem
      # z pakietem `gettext` (warstwa runtime), tutaj trzeba go doinstalować jawnie. Bez tego kroku
      # polecenie niżej kończy się kodem 127 („command not found”), co wygląda jak błąd w plikach
      # tłumaczeń, a jest wyłącznie brakiem narzędzia na goszczącym runnerze.
      - name: Instalacja gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      # Ten sam krok, co w `backend/Dockerfile` – i to jest jedyny powód jego istnienia tutaj.
      # Błąd składni w katalogu tłumaczeń wywraca **budowanie obrazu**, czyli wychodzi dopiero
      # przy wdrożeniu. Tutaj wychodzi przy zgłoszeniu zmiany, kosztem dziesięciu sekund.
      - name: Sprawdzenie katalogów tłumaczeń
        working-directory: backend
        run: |
          set -eu
          for po in locale/*/LC_MESSAGES/django.po apps/*/locale/*/LC_MESSAGES/django.po; do
            [ -e "$po" ] || continue
            echo "== $po"
            msgfmt --check --output-file=/dev/null "$po"
          done

  pip-audit:
    # Znane podatności zależności Pythona (SEC-02, docs/OPERACJE.md § 47.1) – dwa zbiory:
    # - backend: `backend/` nie ma pliku blokady (obraz instaluje z zakresów w pyproject), więc
    #   „zbiór zależności” to wynik **tego samego rozwiązania**, które zrobi budowanie obrazu
    #   w tej chwili (`uv pip compile`, Python i platforma obrazu, z ekstrą dev – obraz ją instaluje),
    # - djcms: dokładnie `djcms/uv.lock` (`uv export --frozen`),
    # - notebook-lab: narzędzia budowy JupyterLite (`backend/apps/notebooks/labbuild/requirements.txt`,
    #   przypięte ze skrótami; QC-01) – nie trafiają do runtime, ale to one składają statykę laboratorium.
    # Czerwono tylko przy podatności z wydaną poprawką; bez poprawki – ostrzeżenie w podsumowaniu.
    # Wyjątki z terminem i uzasadnieniem: `.security/pip-audit-ignore.toml`.
    # Zainstalowane pakiety obrazu (to, co faktycznie wdrażamy) sprawdza dodatkowo Trivy w `image-scan`.
    name: pip-audit (zależności Pythona)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            djcms/uv.lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `cd backend` przed `uv pip compile` jest konieczne: `[tool.uv] override-dependencies`
      # (django-celery-beat a Django 6.1) uv czyta z pyproject katalogu roboczego, a nie z pliku
      # podanego argumentem – z korzenia repozytorium rozwiązanie kończy się „unsatisfiable”.
      - name: Zbiory zależności (backend – rozwiązanie jak w obrazie, djcms – uv.lock)
        run: |
          set -eu
          (cd backend && uv pip compile pyproject.toml --extra dev \
            --python-version "$PYTHON_VERSION" --python-platform x86_64-manylinux_2_28 \
            --no-header --no-annotate -o "$RUNNER_TEMP/backend.txt")
          (cd djcms && uv export --frozen --extra dev --no-emit-project --no-hashes \
            --no-header --no-annotate -o "$RUNNER_TEMP/djcms.txt")
          cp backend/apps/notebooks/labbuild/requirements.txt "$RUNNER_TEMP/notebook-lab.txt"
          wc -l "$RUNNER_TEMP"/*.txt

      # `--no-deps --disable-pip`: zbiór jest już rozwiązany co do wersji, pip-audit ma go tylko
      # sprawdzić, a nie rozwiązywać drugi raz (inną metodą i z innym wynikiem). Baza OSV: obejmuje
      # PyPA advisory database i GHSA. Kod wyjścia pip-audit pomijamy – decyduje bramka niżej, a brak
      # raportu (awaria narzędzia albo sieci) bramka traktuje jak błąd, nie jak „zero podatności”.
      - name: pip-audit
        run: |
          for set in backend djcms notebook-lab; do
            uvx --from "pip-audit==$PIP_AUDIT_VERSION" pip-audit -r "$RUNNER_TEMP/$set.txt" \
              --no-deps --disable-pip --vulnerability-service osv --progress-spinner off \
              --format json --output "$RUNNER_TEMP/$set-audit.json" || true
          done

      - name: Bramka (poprawka dostępna = czerwono, wyjątki z terminem)
        run: |
          rc=0
          for set in backend djcms notebook-lab; do
            python scripts/security/pip_audit_gate.py --label "$set" "$RUNNER_TEMP/$set-audit.json" || rc=1
          done
          exit "$rc"

  supply-chain:
    # Reguły łańcucha dostaw bez sieci, kilka sekund (SEC-02, docs/OPERACJE.md § 47.4–47.5):
    # akcje GitHuba przypięte pełnym SHA, wyjątki Trivy z terminem i uzasadnieniem, zgodność
    # zwendorowanego JS z zapisanymi wersjami i skrótami, testy samych skryptów.
    name: łańcuch dostaw (SHA akcji, vendor JS, wyjątki)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Akcje przypięte SHA, wyjątki Trivy z terminem
        run: python scripts/security/policy_check.py

      - name: Vendor JS – wersje i skróty zgodne z plikami
        run: python scripts/security/vendor_check.py check

      - name: Testy skryptów bezpieczeństwa
        run: |
          python -m pip install --quiet "pytest>=8.3"
          python -m pytest -q -p no:cacheprovider scripts/security/tests

  uptime-script:
    # Monitoring z zewnątrz (`.github/workflows/uptime.yml`, OPS-03) to skrypt bez zależności – jego
    # testy też: sama biblioteka standardowa, bez sieci, bez bazy, kilka sekund. Osobny job, bo
    # `tests` stoi na Django i Postgresie, a ten skrypt nie ma z nimi nic wspólnego. Python z obrazu
    # runnera – ten sam, którym skrypt chodzi w `uptime.yml`; zgodność składni z 3.10 sprawdza test.
    name: uptime_external.py (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Testy monitoringu z zewnątrz
        run: python3 -m unittest discover -s scripts/tests -p "test_uptime_external.py" -v

  tests:
    # ~4700 testów w jednym przebiegu trwało 27–32 minuty – dłużej niż `lint`, `migrations`
    # i `image` razem wzięte, i to ich autor czekał najdłużej na czerwony/zielony wynik.
    # `pytest-split` dzieli zbiór testów na tyle części, ile wpisów ma `matrix.shard` niżej (dziś
    # pięć). Każdy shard dostaje **własny** kontener Postgresa (blok `services` jest per-job, więc
    # matrix mnoży go razem z resztą joba), więc bazy się nie ścigają i nie trzeba nikomu nadawać
    # osobnej nazwy.
    #
    # Podział jest po **zmierzonym czasie**, nie po liczbie testów: `backend/.test_durations`
    # niesie czas każdego testu, a `--splitting-algorithm duration_based_chunks` tnie zbiór na ciągłe
    # kawałki tak, żeby shardy kończyły mniej więcej razem. W każdym shardzie testy idą dodatkowo
    # równolegle (`-n` = rdzenie runnera, pytest-xdist) – docs/TESTY.md. Podział po liczbie dawał shardy od 2 do 17 minut, bo
    # testy PDF-ów, pieczęci elektronicznej i cofania migracji ważą wielokrotnie więcej niż reszta
    # i stoją obok siebie. Test, którego w pliku nie ma (nowy), dostaje czas średni – plik nie
    # musi więc być aktualny co do testu, wystarczy odświeżyć go, gdy shardy znów się rozjadą:
    # `scripts/refresh_test_durations.sh <run-id>` z artefaktów `test-durations-*` tego joba
    # (opis w `docs/TESTY.md` § 5).
    name: "pytest (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    strategy:
      # `fail-fast: false` celowo: shard nr 2 czerwony nie ma ukrywać, że nr 5 też jest czerwony –
      # autor zmiany ma dostać komplet informacji z jednego przebiegu, a nie odkrywać drugą awarię
      # dopiero po naprawieniu pierwszej i ponownym pushu.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    services:
      # Postgres jest jedyną usługą, bez której testy nie ruszą: `config/settings/test.py`
      # podmienia cache na lokalny, magazyn plików na dyskowy, a Celery na tryb `eager`, ale bazy
      # podmienić się nie da – zapytania i migracje są przedmiotem połowy tych testów.
      #
      # Redisa i MinIO **nie ma** tutaj świadomie: w ustawieniach testowych nic ich nie dotyka
      # (`CACHES` = locmem, `SUBMISSION_STORAGE_BACKEND` = lokalny), więc byłyby dwiema usługami,
      # które wydłużają każdy przebieg i dokładają własne tryby awarii, nie sprawdzając niczego.
      # Gdyby któryś test miał kiedyś naprawdę pukać w Redisa, wróci tu razem z nim.
      #
      # `S3_*`/`MINIO_*` niżej to inna sprawa – nie jest to usługa, tylko **poświadczenia**, których
      # potrzebuje kilka testów offline (patrz `env` joba).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: olimpiada
          POSTGRES_USER: olimpiada
          POSTGRES_PASSWORD: olimpiada
        ports: ["5432:5432"]
        # Bez `health-cmd` krok testów startuje, zanim Postgres przyjmie pierwsze połączenie,
        # i przewraca się losowo – raz na kilka przebiegów, czyli najgorszym możliwym rytmem.
        options: >-
          --health-cmd "pg_isready -U olimpiada -d olimpiada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Wszystko przez zmienne środowiskowe, bez pliku .env: to jest ten sam kontrakt, co
      # w compose (`x-app-env`), więc konfiguracja CI nie może rozjechać się z produkcyjną.
      DATABASE_URL: postgres://olimpiada:olimpiada@localhost:5432/olimpiada
      # ≥ 50 znaków – `config/settings/production.py` odmawia startu poniżej tego progu.
      # `apps/submissions/tests/test_bucket_credentials.py` przeładowuje ten moduł ustawień
      # wprost (klucze storage czyta się przy imporcie, nie da się ich podmienić
      # `override_settings`), więc ten sam próg obowiązuje w teście, a nie tylko na produkcji.
      DJANGO_SECRET_KEY: ci-tylko-do-testow-nie-uzywac-nigdzie-indziej-minimum-50-znakow
      DJANGO_SETTINGS_MODULE: config.settings.test
      # E2E_MODE **musi** zostać wyłączone: ustawione zeruje próg antyspamowy i włącza tryb
      # testowy CAPTCHY, więc testy tych dwóch zabezpieczeń przestałyby cokolwiek sprawdzać –
      # i nie powiedziałyby o tym ani słowa.
      E2E_MODE: "0"
      # Poświadczenia MinIO – lokalnie dają je compose i `.env` (patrz `.env.example`), tutaj nie
      # ma ani jednego, ani drugiego. Testy nie dotykają prawdziwego S3 (`config/settings/test.py`
      # ustawia lokalny storage rozwiązań), ale kilka z nich **podpisuje** presigned URL offline
      # (`apps/submissions/tests/test_critic_fixes.py`, `test_download_privacy.py`) albo
      # przeładowuje `config/settings/production.py`, gdzie klucze wchodzą do konfiguracji S3
      # (`test_bucket_credentials.py`) – bez nich boto3 kończy podpisywanie
      # `NoCredentialsError`em, zanim dojdzie do jakiegokolwiek zapytania sieciowego. Wartości są
      # fałszywkami takimi jak w `.env.example` – nic tu naprawdę nie łączy się z MinIO.
      MINIO_ROOT_USER: ci-minio-root
      MINIO_ROOT_PASSWORD: ci-minio-root-haslo-testowe
      S3_PUBLIC_ACCESS_KEY: ci-public-access-key
      S3_PUBLIC_SECRET_KEY: ci-public-secret-key-testowy
      S3_PRIVATE_ACCESS_KEY: ci-private-access-key
      S3_PRIVATE_SECRET_KEY: ci-private-secret-key-testowy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalacja zależności
        working-directory: backend
        run: uv pip install --system -r pyproject.toml --extra dev

      # `backend/Dockerfile` kompiluje katalogi tłumaczeń przy budowaniu obrazu (`gettext` jest
      # w warstwie runtime); tutaj testy odpalają się bez obrazu, a `.mo` kompiluje `conftest.py`
      # (`_compile_translations`) programem `msgfmt` z tego pakietu. Bez niego sesja startuje
      # tylko z ostrzeżeniem, katalog angielski zostaje wyłącznie źródłem (`.po`) i Django cicho
      # oddaje polskie napisy – dokładnie to sprawdzają `apps/accounts/tests/test_mail_language.py`
      # i `apps/web/tests/test_preferences_i18n.py`.
      - name: Instalacja gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      # Katalogi tłumaczeń (``.mo``) kompiluje sam pytest na starcie sesji (``backend/conftest.py``,
      # ``_compile_translations``) – ten sam krok działa więc w CI, w kontenerze i przy ręcznym
      # uruchomieniu, a CI potrzebuje od siebie tylko programu ``msgfmt`` (krok wyżej).
      # ``collectstatic`` nie jest potrzebne: jedyne testy, które pobierają ``/static/...``, włączają
      # findery WhiteNoise same (``apps/web/tests/test_ui_system.py``, ``test_public.py``).

      # Postgres pod testy – dwie zmiany, obie wyłącznie w tym kontenerze:
      # - ``max_locks_per_transaction = 256`` – ta sama wartość, co produkcja i dev
      #   (``docker-compose.yml``). Test migracji trzyma przewiniętą bazę w jednej transakcji
      #   (``apps/core/tests/migration_helpers.py``, ok. 3000 blokad), a pod ``-n auto`` kilka
      #   takich modułów biegnie naraz; domyślne 64 × 100 połączeń to za mało miejsca,
      # - ``fsync``/``synchronous_commit``/``full_page_writes`` wyłączone: baza żyje tyle, co ten job,
      #   a każdy worker zakłada swoją od zera (setki migracji = tysiące commitów).
      # Blok ``services`` nie przyjmuje argumentów polecenia, więc ustawienia idą przez
      # ``ALTER SYSTEM`` i restart kontenera – kilka sekund.
      - name: Postgres pod testy
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          set -eu
          for setting in "max_locks_per_transaction = 256" "fsync = off" \
                         "synchronous_commit = off" "full_page_writes = off"; do
            docker exec "$PG" psql -U olimpiada -d olimpiada -c "ALTER SYSTEM SET $setting"
          done
          docker restart "$PG"
          until docker exec "$PG" pg_isready -U olimpiada -d olimpiada; do sleep 1; done
          docker exec "$PG" psql -U olimpiada -d olimpiada -Atc "SHOW max_locks_per_transaction"

      # Migracje **raz** na shard, potem kopia bazy dla każdego workera (``CREATE DATABASE …
      # TEMPLATE``, ``backend/ci_test_db.py``). Do 8.10.2026 każdy z czterech workerów migrował
      # własną bazę od zera, wszystkie naraz na czterech rdzeniach: 1,5–2,5 min przed pierwszym
      # testem w każdym shardzie. Liczba workerów = rdzenie runnera, podana jawnie i tu, i w
      # ``-n`` niżej – kopie muszą mieć dokładnie te nazwy, których szuka pytest-django
      # (``test_olimpiada_gw0`` …). Zabraknie którejś – pytest-django założy ją sam, tylko wolniej.
      - name: Bazy testowe (migracje raz, kopie dla workerów)
        working-directory: backend
        run: |
          set -eu
          echo "WORKERS=$(nproc)" >> "$GITHUB_ENV"
          python ci_test_db.py "$(nproc)"

      # ``-n $WORKERS`` = tyle workerów, ile rdzeni ma runner (4); ``--reuse-db`` – bazy z kroku
      # wyżej (``migrate`` niczego już nie stosuje). ``conftest.py`` zamienia ``-n`` na ``--dist
      # loadgroup`` i przekazuje to workerom, więc moduł testów migracji idzie w całości do jednego
      # workera (przewinięcie bazy liczy się raz na moduł, a nie raz na test – docs/TESTY.md § 4).
      #
      # ``duration_based_chunks``, a nie ``least_duration``: shard dostaje **ciągły** kawałek zbioru,
      # więc moduł z drogą fiksturą modułu (przewinięta baza) nie jest rozrzucany po pięciu
      # shardach, z których każdy płaciłby za nią osobno.
      #
      # ``-p _durations_plugin``: przy okazji przebieg mierzy czasy swoich testów (bez kosztu baz
      # workerów) – artefakt ``test-durations-<shard>`` niżej. Z pięciu takich plików
      # ``scripts/refresh_test_durations.sh`` składa nowe ``backend/.test_durations``, gdy shardy
      # się rozjadą – pomiar z tej samej maszyny, na której podział ma działać.
      - name: pytest
        working-directory: backend
        env:
          TEST_DURATIONS_FILE: ${{ runner.temp }}/test-durations-${{ matrix.shard }}.json
        run: >-
          python -m pytest -q --reuse-db --durations=20 -n "$WORKERS" -p _durations_plugin
          --splits ${{ strategy.job-total }} --group ${{ matrix.shard }}
          --splitting-algorithm duration_based_chunks

      - name: Czasy testów (artefakt do odświeżenia .test_durations)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-durations-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  djcms:
    # Wersja porównawcza na django CMS (`djcms/`, docs/tasks/DJ-01.md) – osobny projekt Django
    # z własnymi zależnościami (dokładna blokada `djcms/uv.lock`), więc i osobny job: lint, checki,
    # migracje i testy w jednym przebiegu. Testów jest kilkadziesiąt (sekundy), shardowanie jak
    # w `tests` nie miałoby tu czego dzielić.
    name: djcms (ruff, check, migracje, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: olimpiada_djcms
          POSTGRES_USER: olimpiada_djcms
          POSTGRES_PASSWORD: olimpiada_djcms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olimpiada_djcms -d olimpiada_djcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://olimpiada_djcms:olimpiada_djcms@localhost:5432/olimpiada_djcms
      DJANGO_SETTINGS_MODULE: config.settings.test
      # Te same arkusze co aplikacja główna – w obrazie kopiowane do /opt/shared_static, tutaj
      # wskazane wprost w drzewie repozytorium (djcms/config/settings/base.py).
      DJCMS_SHARED_STATIC_DIR: ../backend/static
    defaults:
      run:
        working-directory: djcms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: djcms/uv.lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `--frozen`: dokładnie te wersje, które instaluje obraz (djcms/Dockerfile). Blokada, która
      # rozjechała się z pyproject.toml, ma tu wywrócić job, a nie zostać po cichu przeliczona.
      - name: Instalacja zależności (uv.lock)
        run: uv sync --frozen --extra dev --python "$(which python)"

      - name: ruff check
        run: .venv/bin/ruff check .

      - name: ruff format --check
        run: .venv/bin/ruff format --check .

      - name: manage.py check
        run: .venv/bin/python manage.py check --fail-level WARNING

      - name: Czy modele mają komplet migracji
        run: .venv/bin/python manage.py makemigrations --check --dry-run

      - name: pytest
        run: .venv/bin/python -m pytest -q --create-db

  pytest-ok:
    # Jeden wymagany check zamiast pięciu (nazwy shardów zmieniają się z liczbą shardów w matrixie,
    # więc nie nadają się na regułę ochrony gałęzi). `if: always()` musi tu być: bez niego ten job
    # w ogóle by się nie uruchomił, gdyby któryś shard padł – a wtedy `needs.tests.result` nigdy nie
    # przyjąłby wartości `failure`, tylko cały workflow zatrzymałby się bez tego joba,
    # czyli bez czytelnej, jednej odpowiedzi „testy przeszły / nie przeszły”.
    name: pytest (wynik zbiorczy)
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()
    steps:
      - name: Czy wszystkie shardy przeszły
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Co najmniej jeden shard pytest nie przeszedł (wynik: ${{ needs.tests.result }})."
            exit 1
          fi

  a11y:
    # Testy dostępności (A11Y-01, docs/OPERACJE.md § 50): axe-core (WCAG 2.1 A/AA) na ~70 ekranach
    # obu konkursów i obu motywów + klawiatura, fokus, menu bez JS, wysoki kontrast, RTL, reflow.
    # Ten sam skrypt, co lokalnie (scripts/a11y.sh): własna sieć Dockera, Postgres w tmpfs, serwer
    # z obrazu `web` (ustawienia config.settings.a11y – bez Redisa, MinIO, ClamAV) i kontener
    # Playwrighta scenariusza E2E. Różnica jest jedna: kod pochodzi z obrazu zbudowanego z tego
    # commita, a nie z katalogu hosta (A11Y_MOUNT_BACKEND=0) – `.mo` są w obrazie skompilowane.
    #
    # Job przewraca się na **nowym** naruszeniu critical/serious (spoza e2e/a11y/baseline.json)
    # i na każdym niezaliczonym teście klawiatury. Raport (JSON/Markdown + zrzuty) jest artefaktem.
    name: dostępność (axe + klawiatura)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Jawnie i najwęziej (SEC-02, OPERACJE § 47): job tylko czyta kod i wgrywa artefakt raportu.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Ten sam cel i ten sam cache warstw (gha), co zadanie `image` – drugi build tego samego
      # Dockerfile'a trafia w cache i trwa tyle, co eksport obrazu do lokalnego demona.
      - name: Obraz web (runtime) do testów
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: runtime
          load: true
          push: false
          tags: olimpiada-web:a11y
          cache-from: type=gha

      - name: Testy dostępności
        env:
          A11Y_WEB_IMAGE: olimpiada-web:a11y
          A11Y_MOUNT_BACKEND: "0"
        run: bash scripts/a11y.sh

      - name: Raport dostępności
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-report
          path: e2e/artifacts/a11y/
          if-no-files-found: ignore
          retention-days: 14

  image:
    name: docker build (+ GHCR dla main i v*)
    runs-on: ubuntu-latest
    # `packages: write` wyłącznie tutaj i wyłącznie po to, żeby wypchnąć obraz do GHCR wbudowanym
    # `GITHUB_TOKEN`-em. `contents: read` wpisane jawnie, bo podanie jednego uprawnienia zeruje
    # pozostałe – bez tej linijki `actions/checkout` nie miałby czym sklonować repozytorium.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Kto publikuje, a kto tylko buduje – jedno miejsce, z którego biorą się i tagi, i decyzja.
      # Wartości z kontekstu `github` wchodzą tu przez zmienne środowiskowe, a nie przez `${{ }}`
      # w treści polecenia: nazwa gałęzi jest tekstem od autora zgłoszenia, więc wklejona wprost
      # do skryptu byłaby wstrzyknięciem poleceń do powłoki biegnącej z tokenem tego zadania.
      - name: Tagi obrazu i decyzja o publikacji
        id: obraz
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # Nazwa pakietu w GHCR musi być małymi literami, a nazwa organizacji na GitHubie nie musi.
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/olimpiada-web"
          short="$(printf '%s' "$SHA" | cut -c1-7)"
          case "$REF" in
            # Wydanie: obraz pod nazwą wersji. To jest tag, który wpisuje się w WEB_IMAGE
            # na serwerze (scripts/deploy.sh, README § 3).
            refs/tags/v*)    push=true;  tags="$image:$REF_NAME,$image:sha-$short" ;;
            # `main`: obraz „to, co na głównej” – do stagingu i do świeżej instalacji z paczki,
            # zanim powstanie kolejny znacznik.
            refs/heads/main) push=true;  tags="$image:main,$image:sha-$short" ;;
            # Pull request (także z forka): buduje się, nie publikuje. Tag jest wymagany przez
            # akcję nawet przy `push: false`, więc podajemy jeden, lokalny.
            *)               push=false; tags="$image:pr" ;;
          esac
          {
            echo "push=$push"
            echo "tags=$tags"
            echo "source=https://github.com/$REPO"
            echo "version=$REF_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "publikacja=$push, tagi=$tags"

      - name: Logowanie do GHCR
        if: steps.obraz.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Budowanie ma sens także bez publikacji i to jest jego pierwsze zadanie: obraz musi dać się
      # zbudować, zanim ktoś odpali `scripts/deploy.sh`, bo tam buduje się go na serwerze
      # produkcyjnym – nieudane budowanie zostawia serwis na starej wersji w połowie wdrożenia.
      # Ten krok wyłapuje przy okazji rzeczy, których nie widzi pytest: brakującą zależność
      # systemową i błąd w katalogu tłumaczeń (Dockerfile woła `msgfmt`).
      #
      # Publikacja (`main`, `v*`) dokłada do tego obraz, którym da się postawić instalację bez
      # kompilatora na serwerze: `WEB_IMAGE=ghcr.io/…` w .env albo w wywołaniu wdrożenia.
      # Nie publikujemy osobnych obrazów `worker` i `beat` – to ten sam obraz z innym poleceniem
      # (docker-compose.yml, `x-app-base`). Obrazów nie podpisujemy (cosign to osobna pozycja).
      - name: Budowanie obrazu produkcyjnego
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: runtime
          push: ${{ steps.obraz.outputs.push }}
          tags: ${{ steps.obraz.outputs.tags }}
          # Etykiety OCI: bez `image.source` GHCR nie wie, do którego repozytorium należy pakiet,
          # i nie pokazuje przy nim ani kodu, ani licencji.
          labels: |
            org.opencontainers.image.source=${{ steps.obraz.outputs.source }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.obraz.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          # Cache warstw w cache'u Actions – bez niego każdy przebieg instaluje zależności od zera.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-scan:
    # Trivy na zbudowanych obrazach (SEC-02, docs/OPERACJE.md § 47.2): pakiety systemowe Debiana
    # z obrazu bazowego i pakiety Pythona faktycznie zainstalowane w /opt/venv.
    #
    # Po `image`, bo obraz `web` budujemy tu drugi raz **z cache'u warstw**, który `image` właśnie
    # zapisał (`type=gha`, ten sam Dockerfile i kontekst) – warstwy przychodzą z cache'u, więc to
    # kilkadziesiąt sekund, a nie przenoszenie obrazu między jobami w artefakcie. djcms CI dotąd
    # nie budował; ma własny zakres cache'u (`scope=djcms`), żeby nie wypierać warstw `web`.
    #
    # Dwa przebiegi Trivy na jednej bazie (cache bazy wg daty – wbudowany w trivy-action):
    # 1. bramka: CRITICAL/HIGH **z wydaną poprawką** → czerwono. Bez `ignore-unfixed` CI stałby
    #    czerwony za CVE Debiana, na które nie ma jeszcze łatki, i przestałby cokolwiek znaczyć,
    # 2. raport SARIF (CRITICAL/HIGH, także bez poprawki) → zakładka Security / Code scanning
    #    (repozytorium publiczne – bez dodatkowej licencji) i artefakt przebiegu jako zapas.
    # Wyjątki z terminem: `.security/trivyignore.yaml` (natywny format Trivy, `expired_at`).
    name: "trivy (obraz ${{ matrix.name }})"
    runs-on: ubuntu-latest
    needs: [image]
    # `security-events: write` wyłącznie do wysłania SARIF; `actions: read` wymaga upload-sarif
    # przy repozytoriach prywatnych – zostaje na wypadek zmiany widoczności.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: ./backend
            file: ./backend/Dockerfile
            cache-from: type=gha
            cache-to: ""
          - name: djcms
            # Kontekst = korzeń repozytorium (djcms/Dockerfile kopiuje backend/static).
            context: .
            file: ./djcms/Dockerfile
            cache-from: type=gha,scope=djcms
            cache-to: type=gha,scope=djcms,mode=max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Obraz do skanu (z cache'u warstw)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: runtime
          push: false
          load: true
          tags: olimpiada-scan/${{ matrix.name }}:ci
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ matrix.cache-to }}

      - name: Trivy – bramka (CRITICAL/HIGH z poprawką)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: olimpiada-scan/${{ matrix.name }}:ci
          version: ${{ env.TRIVY_VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .security/trivyignore.yaml

      - name: Trivy – raport SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: olimpiada-scan/${{ matrix.name }}:ci
          version: ${{ env.TRIVY_VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          trivyignores: .security/trivyignore.yaml

      # PR z forka dostaje token tylko do odczytu – wysyłka SARIF i tak by się nie udała, więc jej
      # nie próbujemy (wynik jest w artefakcie). `continue-on-error`: wyłączone code scanning
      # w ustawieniach repozytorium nie może zasłaniać wyniku bramki.
      - name: SARIF → code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: SARIF jako artefakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif
          retention-days: 30
          if-no-files-found: ignore
