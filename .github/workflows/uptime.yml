# Monitoring z zewnątrz (OPS-03, docs/tasks/OPS-03.md, docs/OPERACJE.md § 46).
#
# Watchdog aplikacyjny i Uptime Kuma stoją na tym samym VPS-ie, co serwis – śmierć hosta zabiera
# je razem z nim i nikt nie dostaje listu. Ten workflow chodzi na infrastrukturze GitHuba (repozytorium
# jest publiczne, więc minuty są darmowe) i co 10 minut pyta przez publiczne HTTPS o obie witryny,
# `/healthz/`, `/status.json` (także `backup_restore_check`), LiveKit i ważność certyfikatów TLS.
#
# Alarm = **jedno** zgłoszenie z etykietą `awaria` (GitHub wysyła list obserwującym repozytorium):
# zakładane przy awarii potwierdzonej w dwóch próbach odległych o 2 minuty, komentowane tylko przy
# zmianie zestawu awarii, zamykane samo po powrocie. Stanem jest to zgłoszenie – żadnych plików,
# cache'u ani artefaktów. Logika i testy: `scripts/uptime_external.py`, `scripts/tests/`.
#
# Ograniczenia crona GitHuba (OPERACJE § 46.2): przebiegi bywają opóźnione o kilkanaście–kilkadziesiąt
# minut albo pominięte, a po **60 dniach bez commitów** w repozytorium GitHub wyłącza ten workflow po
# cichu. Dlatego druga opinia spoza GitHuba (UptimeRobot, OPERACJE § 46.4) jest zalecana.
name: Uptime

on:
  schedule:
    # Co 10 minut, przesunięte o 4 minuty od pełnej dziesiątki: na `:00` kolejka crona GitHuba jest
    # najbardziej zatkana i przebiegi z pełnych godzin najczęściej się spóźniają albo wypadają.
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

# Tylko to, czego skrypt potrzebuje: odczyt repozytorium (checkout) i zgłoszenia. Bez sekretów –
# wyłącznie wbudowany `GITHUB_TOKEN`.
permissions:
  contents: read
  issues: write

# Przebieg ręczny i z crona naraz założyłyby dwa zgłoszenia (oba nie widzą jeszcze cudzego).
# Nie przerywamy trwającego: przerwany w połowie zostawiłby komentarz bez zamknięcia.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  uptime:
    name: monitoring z zewnątrz
    # Fork nie odpytuje cudzej produkcji z crona i nie zakłada zgłoszeń we własnym repozytorium.
    if: github.repository == 'qaif/olimpiada_kwantowa_2026'
    runs-on: ubuntu-latest
    # Martwy serwer: 2 próby × (7 żądań + 3 uzgodnienia TLS, każde do 20 s) + 120 s ≈ 9 min.
    timeout-minutes: 15
    steps:
      # Jedyna akcja – przypięta pełnym SHA (v4.4.0, `gh api repos/actions/checkout/git/ref/tags/v4.4.0`),
      # bez zapisanego tokenu w `.git/config` i tylko z jednym plikiem: krok niżej nie potrzebuje
      # niczego więcej, a każdy plik mniej to mniej rzeczy, które mogłyby się tu wykonać.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/uptime_external.py
          sparse-checkout-cone-mode: false

      # Python 3 i `gh` są na obrazie `ubuntu-latest` – bez setup-python i bez akcji do zgłoszeń.
      # Zmienne kontekstu idą przez `env`, nie przez `${{ }}` w treści polecenia (zmienne repozytorium
      # są tekstem; wklejone do skryptu powłoki byłyby wstrzyknięciem poleceń).
      - name: Sprawdzenie i zgłoszenie `awaria`
        env:
          GH_TOKEN: ${{ github.token }}
          # Puste = domyślne w skrypcie (olimpiadakwantowa.pl, iqo-official.org, live.olimpiadakwantowa.pl).
          UPTIME_SITES: ${{ vars.UPTIME_SITES }}
          UPTIME_LIVE: ${{ vars.UPTIME_LIVE }}
        run: python3 scripts/uptime_external.py --issues
