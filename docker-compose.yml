# Platforma Olimpiady – docker compose
# Profile: domyślny = produkcja/staging, `--profile dev` dodaje mailpit i wystawia porty pomocnicze.
# Sekrety wyłącznie przez .env (patrz .env.example). Żadna usługa danych nie jest w sieci `edge`.
# Pierwsze uruchomienie u nowego operatora (bez ClamAV-a i własnego MTA, obraz z GHCR):
# nakładka `docker-compose.operator.yml` – README § 3 i docs/OPERACJE.md § 4.3.

# Rotacja logu kontenera: bez limitu `json-file` rośnie bez końca na dysku hosta, aż go zapełni –
# usługa gadatliwa w awarii (worker w pętli ponowień, proxy pod atakiem) wywołałaby wtedy drugą
# awarię, tym razem dysku, zamiast zostać po prostu w logu. 50 MB × 5 plików = 250 MB na usługę,
# z zapasem na przejrzenie ostatniej awarii, a nie tylko ostatniej minuty. Jedna definicja (kotwica
# YAML), żeby żadna nowa usługa nie została bez limitu przez przeoczenie.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  # Hasło Redisa (REDIS_PASSWORD w .env) wchodzi do adresu jako `:<hasło>@` tylko wtedy, gdy jest
  # niepuste – serwer, którego .env jeszcze go nie ma, dostaje adres co do znaku dotychczasowy
  # (i Redis bez `requirepass`, patrz usługa `redis`). Hasło wyłącznie [A-Za-z0-9] (generuje je
  # scripts/deploy.sh): wklejone do URL-a bez kodowania, więc `@ : / # ? %` zmieniłyby jego znaczenie.
  REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD:-}@}redis:6379/0
  CELERY_BROKER_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD:-}@}redis:6379/1
  S3_ENDPOINT_URL: http://minio:9000
  # Host, pod którym przeglądarka widzi MinIO (Caddy: s3.<SITE_DOMAIN>); dev override podaje localhost:9000.
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-https://s3.${SITE_DOMAIN:-localhost}}
  S3_SUBMISSIONS_BUCKET: submissions
  S3_PUBLIC_BUCKET: public-media
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  # Backend honoruje X-Real-IP WYŁĄCZNIE od kontenera `proxy` (Caddy): jego dwa stałe adresy
  # (`ipv4_address` przy usłudze `proxy` niżej) – w `edge` i w `internal`, bo nazwa `web` rozwiązuje
  # się Caddy'emu na adres z dowolnej z dwóch wspólnych sieci. Do 10.10.2026 stały tu całe podsieci
  # 172.30.1.0/24 i 172.30.2.0/24, czyli „zaufanym proxy” był też djcms, monitor, minio, clamav,
  # poczta i `jitsi-web` z osobnego projektu – każdy z nich mógł podać dowolny X-Real-IP (obejście
  # limitów prób, fałszywy adres w audycie; audyt bezpieczeństwa 10.10.2026, S20). Ta sama wartość
  # ze zmiennych co przypięcie, więc zmiana adresu proxy w .env przesuwa obie rzeczy naraz
  # (scripts/tests/compose_profiles_test.sh). Ustawione TRUSTED_PROXY_IPS w .env wygrywa – serwer,
  # którego .env ma jeszcze dawne podsieci, scripts/deploy.sh przestawia sam (krok 4/8).
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-${PROXY_EDGE_IP:-172.30.1.250}/32,${DJCMS_PROXY_IP:-172.30.2.250}/32}
  # Nazwa usługi w `pg_stat_activity.application_name` – `worker` i `beat` nadpisują ją niżej.
  # Po niej `manage.py db_connections` i list alarmowy mówią, **który** kontener trzyma połączenia.
  DB_APPLICATION_NAME: olimpiada-web
  # --- Reszta środowiska aplikacji: JAWNA lista zamiast `env_file: .env` (audyt 10.10.2026, W6) ---
  # Do 10.10.2026 web, worker i beat dostawały CAŁY .env (`env_file`), czyli także sekrety, których
  # aplikacja nie czyta: hasło szyfrowania kopii i klucze magazynu kopii (BACKUP_*), konto root
  # MinIO, hasło bazy i klucz djcms, przepustkę strony prac technicznych. Proces `web` parsuje
  # PDF-y, arkusze, obrazy i notatniki od użytkowników – jedno RCE albo odczyt /proc/self/environ
  # dawało wtedy komplet do „ransomware z usunięciem kopii”. Teraz kontener widzi wyłącznie to, co
  # aplikacja czyta (`env(…)`/`os.environ` w backend/config i backend/apps, plus entrypoint).
  #
  # Wpis BEZ wartości (`NAZWA:`) = wartość z .env (albo ze środowiska polecenia compose), a gdy jej
  # tam nie ma – zmiennej w kontenerze NIE ma wcale. To jest dokładnie zachowanie `env_file`: pusta
  # linijka w .env daje pusty napis, brak linijki – wartość domyślną z config/settings. Wpis
  # z `${NAZWA:-}` dawałby pusty napis zamiast braku, a `env.int("X", default=…)` na pustym napisie
  # kończy się wyjątkiem przy starcie.
  #
  # Nowa zmienna czytana przez aplikację = nowa linijka tutaj. Pilnuje tego
  # scripts/tests/compose_env_test.sh (zmienna czytana w kodzie, a nieprzekazana, albo przekazany
  # sekret spoza aplikacji = czerwony test). Celowo NIE ma tu: MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
  # (aplikacja używa kont serwisowych S3_PUBLIC_*/S3_PRIVATE_*; root zostaje dla minio, minio-init
  # i skryptów kopii na hoście), POSTGRES_PASSWORD (hasło jest już w DATABASE_URL wyżej),
  # COORDINATOR_EMAIL/COORDINATOR_PASSWORD (podaje je wyłącznie `docker compose exec -e` przy
  # zakładaniu konta), BACKUP_*, DJCMS_SECRET_KEY, DJCMS_DB_PASSWORD, MAINTENANCE_BYPASS_TOKEN.
  # Django i adresy
  DJANGO_SECRET_KEY:
  DJANGO_DEBUG:
  DJANGO_ALLOWED_HOSTS:
  DJANGO_CSRF_TRUSTED_ORIGINS:
  DJANGO_LOG_LEVEL:
  DJANGO_MEDIA_ROOT:
  SITE_DOMAIN:
  EXTRA_DOMAINS:
  PLATFORM_SUBDOMAINS:
  APP_VERSION:
  E2E_MODE:
  SESSION_COOKIE_SECURE:
  CSRF_COOKIE_SECURE:
  ERROR_PAGE_CONTACT_EMAIL:
  WAGTAIL_SITE_NAME:
  WAGTAILADMIN_BASE_URL:
  WAGTAIL_I18N_ENABLED:
  PAGE_CACHE_ENABLED:
  PAGE_CACHE_SECONDS:
  # Entrypoint (backend/entrypoint.sh) – `worker` i `beat` ustawiają oba na "0" niżej.
  RUN_MIGRATIONS:
  RUN_COLLECTSTATIC:
  # Kreator pierwszego uruchomienia (/setup/, apps/tenancy/setup.py)
  SETUP_TOKEN:
  SETUP_TOKEN_FILE:
  SETUP_THROTTLE_RATE:
  # Baza – pula i progi alarmu (adres bazy wyżej)
  DB_POOL:
  DB_POOL_MAX_SIZE:
  DB_POOL_MIN_SIZE:
  DB_POOL_TIMEOUT:
  DB_CONN_MAX_AGE:
  DB_CONNECTIONS_WARN_PERCENT:
  DB_CONNECTIONS_CRITICAL_PERCENT:
  WEB_THREADS:
  # Celery
  CELERY_TASK_SOFT_TIME_LIMIT:
  CELERY_TASK_TIME_LIMIT:
  # Magazyn plików: konta serwisowe z dostępem do jednego bucketu (tworzy je `minio-init`)
  S3_PUBLIC_ACCESS_KEY:
  S3_PUBLIC_SECRET_KEY:
  S3_PRIVATE_ACCESS_KEY:
  S3_PRIVATE_SECRET_KEY:
  S3_PRESIGNED_TTL_SECONDS:
  S3_REGION:
  SUBMISSION_STORAGE_BACKEND:
  CLAMAV_STREAM_MAX_BYTES:
  # Skan antywirusowy mediów redakcyjnych (dokumenty i obrazy Wagtaila); docker-compose.operator.yml
  # (bez ClamAV-a) wyłącza go domyślnie.
  CMS_MEDIA_AV_SCAN:
  WORKSHOP_VIDEO_MAX_MB:
  WORKSHOP_FILE_MAX_MB:
  # Limit uploadu – ta sama zmienna co `request_body` w Caddym (usługa `proxy`): aplikacja odmawia
  # z komunikatem, zanim proxy utnie żądanie kodem 413.
  MAX_UPLOAD_MB:
  # Paczki do pobrania (eksport RODO, ZIP prac dla recenzenta) składane na dysku, a nie w /tmp
  # (tmpfs 256 MB w pamięci, wspólny z uploadami) – wolumen `package_tmp` przy `web` i `worker`;
  # katalog należy do użytkownika `app` (backend/Dockerfile). `beat` paczek nie składa.
  PACKAGE_TMP_DIR: /var/tmp/packages
  PACKAGE_MAX_BYTES:
  # Poczta i alarmy
  EMAIL_URL:
  EMAIL_TIMEOUT:
  DEFAULT_FROM_EMAIL:
  SUBMISSION_FORWARD_MAX_ATTACHMENT_MB:
  ALERT_EMAILS:
  # Logowanie: Google/Facebook, 2FA
  GOOGLE_OAUTH_CLIENT_ID:
  GOOGLE_OAUTH_CLIENT_SECRET:
  FACEBOOK_APP_ID:
  FACEBOOK_APP_SECRET:
  TWO_FACTOR_ENABLED:
  TWO_FACTOR_REQUIRED_ROLES:
  # Pieczęć elektroniczna dokumentów
  CERT_SIGN_P12_PATH:
  CERT_SIGN_P12_PASSWORD:
  CERT_SIGN_TSA_URL:
  CERT_SIGN_REASON:
  CERT_SIGN_LOCATION:
  # Forum
  FORUM_DAILY_DIGEST_HOUR_UTC:
  FORUM_MODERATION_DIGEST_DELAY_MINUTES:
  FORUM_MODERATION_DIGEST_INTERVAL_HOURS:
  FORUM_THREAD_NOTIFY_INTERVAL_HOURS:
  # Ocena AI
  AI_GRADING_MAX_BATCH:
  AI_GRADING_MAX_CONCURRENCY:
  AI_GRADING_MAX_TOKENS:
  AI_GRADING_REQUEST_TIMEOUT:
  AI_GRADING_SDK_MAX_RETRIES:
  AI_GRADING_STALE_MINUTES:
  # Przepustki do własnego Jitsi
  JITSI_JWT_APP_ID:
  JITSI_JWT_APP_SECRET:
  JITSI_JWT_AUDIENCE:
  JITSI_JWT_SUBJECT:
  JITSI_JWT_HOST:
  JITSI_JWT_LEAD_MINUTES:
  JITSI_JWT_GRACE_MINUTES:
  JITSI_JWT_PRECHECK_MINUTES:
  JITSI_JWT_SESSION_MINUTES:
  JITSI_JWT_GATEWAY_MINUTES:
  JITSI_JWT_ROOM_MAX_DAYS:
  JITSI_JWT_COMMITTEE_ROOM_MAX_DAYS:
  # Serwis na django CMS: token wewnętrznego API i klucz SSO (te same wpisy dostaje usługa `djcms`)
  DJCMS_INTERNAL_TOKEN:
  DJCMS_SSO_KEY:
  DJCMS_MAIN_PUBLIC_URL:

x-app-base: &app-base
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: runtime
  # Bez `WEB_IMAGE` wartość jest dokładnie ta, co była – obraz budowany na miejscu i tagowany
  # wersją wdrożenia. Ustawione `WEB_IMAGE` (np. ghcr.io/qaif/olimpiada-web:v0.24.0) podmienia
  # źródło obrazu dla `web`, `worker` i `beat` naraz: to jeden obraz z trzema poleceniami, więc
  # trzy różne tagi znaczyłyby trzy różne wersje kodu w jednym wdrożeniu.
  image: ${WEB_IMAGE:-olimpiada/web:${APP_VERSION:-dev}}
  # Bez `env_file: .env` (do 10.10.2026 był tu) – pełna lista zmiennych w `x-app-env` wyżej.
  environment: *app-env
  # `cache` – osobna sieć Redisa (patrz `networks:` na końcu pliku): web, worker i beat to jedyni
  # jego klienci, więc tylko oni do niej należą. `mail` – tak samo dla relaya poczty (usługa `mail`).
  networks: [internal, cache, mail]
  restart: unless-stopped
  logging: *default-logging
  read_only: true
  tmpfs:
    - /tmp:size=256m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  depends_on:
    db:        { condition: service_healthy }
    redis:     { condition: service_healthy }
    minio:     { condition: service_healthy }

services:
  proxy:
    # 2.10, przypięte skrótem (audyt 10.10.2026): 2.8 było zbudowane Go 1.22, bez poprawek
    # biblioteki standardowej z 2025 (net/http, crypto/tls), a sam tag pływa. Skrót = indeks
    # wieloarchitekturowy `caddy:2.10` z 10.10.2026 (`docker buildx imagetools inspect caddy:2.10`,
    # Caddy v2.10.2). Aktualizacja = nowy skrót z tego samego polecenia (i ten sam obraz
    # w scripts/tests/*caddy*/djcms_routing_test.sh, które sprawdzają konfigurację na żywym Caddym).
    image: caddy:2.10@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    logging: *default-logging
    # Utwardzenie jak przy usługach aplikacji: Caddy jest jedynym kontenerem z portem na świat, więc
    # błąd w nim (parser HTTP/2, QUIC, TLS) ma dostać jak najmniej. `cap_drop: [ALL]` + jedno
    # uprawnienie, którego potrzebuje: wiązanie portów < 1024 (80, 443). `read_only`: Caddy pisze
    # wyłącznie do /data (certyfikaty, klucze ACME – wolumen `caddy_data`) i /config (autozapis
    # konfiguracji – `caddy_config`); /tmp na tmpfs, bo scripts/proxy_config.sh i djcms_switch.sh
    # walidują tam nową konfigurację (`cat > /tmp/Caddyfile.next && caddy validate`). Wszystkie
    # pozostałe montaże są tylko do odczytu. Sprawdzone 10.10.2026 na caddy:2.10 z tym zestawem:
    # start, wystawienie certyfikatu (lokalne CA), `caddy validate` w /tmp, `caddy reload`.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "9000:9000"   # publiczny endpoint S3 (S3_PUBLIC_ADDRESS=<domena>:9000), gdy brak rekordu DNS s3.<domena>
    volumes:
      # KATALOG z plikiem `Caddyfile`, a nie pojedynczy plik (docs/OPERACJE.md § 23). Domyślnie
      # deploy/ z repozytorium – środowisko deweloperskie dostaje dokładnie deploy/Caddyfile.
      # Serwer ma w .env CADDY_CONFIG_DIR=./caddy: katalog stanu, który krok 2/8 scripts/deploy.sh
      # omija (jak maintenance/), a plik w nim składa scripts/proxy_config.sh (deploy/Caddyfile
      # + .env, caddy validate). Montaż pojedynczego pliku z deploy/ trzymał i-węzeł z chwili startu
      # kontenera – po wdrożeniu Caddy widział skasowaną, starą treść. Katalog, który nie znika,
      # widzi każdą nową wersję, więc wdrożenie ładuje ją przez `caddy reload`, bez restartu proxy.
      - ${CADDY_CONFIG_DIR:-./deploy}:/etc/caddy:ro
      - static_files:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
      # Strona „Prace techniczne” (docs/OPERACJE.md § 20): flaga `on`, komunikat operatora
      # i kopia deploy/maintenance/ (page/). Katalog stanu, a nie kod z repozytorium: krok 2/8
      # scripts/deploy.sh kasuje katalogi z kodem i rozpakowuje je od nowa, a działający kontener
      # widziałby wtedy stary, skasowany katalog aż do restartu – czyli bez strony. Ten katalog
      # deploy.sh omija, a treść strony odświeża w nim `scripts/maintenance.sh sync` (krok 4/8).
      - ${MAINTENANCE_DIR:-./maintenance}:/srv/maintenance:ro
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      S3_PUBLIC_ADDRESS: ${S3_PUBLIC_ADDRESS:-s3.${SITE_DOMAIN:-localhost}}
      ACME_EMAIL: ${ACME_EMAIL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # Przepustka operatora przez stronę prac technicznych (nagłówek X-Maintenance-Bypass albo
      # ciasteczko z /__maintenance/bypass?token=…). Pusta albo krótsza niż 32 znaki = nikt.
      MAINTENANCE_BYPASS_TOKEN: ${MAINTENANCE_BYPASS_TOKEN:-}
    # internal: trasa s3.<domena> -> minio (i web, djcms). `meet`: wyłącznie proxy i `jitsi-web`
    # z osobnego projektu Jitsi (deploy/jitsi) – patrz `networks:` na końcu pliku.
    #
    # Stałe adresy w `edge` i `internal` (audyt 10.10.2026, S20): od nich – i tylko od nich – web
    # przyjmuje X-Real-IP (TRUSTED_PROXY_IPS w `x-app-env`), a djcms także X-Djcms-Mode. Adresy
    # z końca puli (Docker przydziela dynamiczne od początku). `DJCMS_PROXY_IP` – nazwa zmiennej
    # sprzed tej zmiany (DJ-02 przypinał adres tylko przy włączonym djcms, nakładką
    # docker-compose.djcms.yml); zostaje, żeby .env serwera z tą linijką działał bez edycji.
    # Zmiana któregoś adresu (kolizja w podsieci) – tylko w .env, TRUSTED_PROXY_IPS idzie za nią.
    networks:
      edge:
        ipv4_address: ${PROXY_EDGE_IP:-172.30.1.250}
      internal:
        ipv4_address: ${DJCMS_PROXY_IP:-172.30.2.250}
      meet:
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    <<: *app-base
    # WSGI (gthread), nie ASGI: aplikacja jest w 100% synchroniczna (grep potwierdza – brak
    # `async def` widoku, `channels`, websocketów), a pod ASGI (gunicorn + UvicornWorker) Django
    # wykonuje każdy widok synchroniczny w **jednym** wątku puli na proces (`ThreadSensitiveContext`)
    # – concurrency procesu to wtedy `--workers`, nie `--workers` razy nic. Test obciążeniowy
    # z 22.09.2026 pokazał tego cenę: 3 workery = maks. 3 równoległe żądania, ok. 7 req/s w nasyceniu,
    # 300–600% CPU z samego przełączania wątków, a `DB_CONN_MAX_AGE` trzeba było trzymać na 0 (patrz
    # niżej), bo trwałe połączenie przypięte do wątku zostawało otwarte długo po żądaniu.
    # `gthread` daje worker **wielowątkowy** bez zmiany w kodzie widoków: concurrency procesu to
    # `--workers` razy `--threads` (4×4 = 16 równoległych żądań). Połączenia z bazą bierze z puli
    # psycopg (jedna na proces, domyślnie `DB_POOL_MAX_SIZE` = `WEB_THREADS`) – patrz `DATABASES`
    # w `backend/config/settings/base.py`.
    # `--logger-class` (audyt 10.10.2026): access log bez tokenów z adresów jednorazowych (aktywacja,
    # reset hasła, zaproszenia, zgody, przepustka wideo…) – w ścieżce, w zapytaniu i w Refererze.
    # Log trafia do `docker logs` (250 MB na usługę) i do każdego zgłoszenia z wklejonym fragmentem,
    # a token z niego jest gotowym linkiem do cudzego konta. Lista prefiksów:
    # backend/config/gunicorn_logging.py.
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000 --workers ${WEB_WORKERS:-4} --threads ${WEB_THREADS:-4}
      --worker-class gthread
      --timeout 120 --graceful-timeout 30 --max-requests 2000 --max-requests-jitter 200
      --access-logfile - --logger-class config.gunicorn_logging.TokenMaskingLogger
    # `mem_limit`/`mem_reservation`, nie `deploy.resources`: to drugie czyta wyłącznie Swarm,
    # a ten compose stoi na jednej maszynie bez Swarma – limit w `deploy:` byłby dokumentacją,
    # która nigdy niczego nie ogranicza. 2g na 4 workery × 4 wątki (po ~250 MB RSS na worker plus
    # stary i nowy worker naraz przy rotacji `--max-requests`) zostawia zapas nad typowym zużyciem,
    # a jednocześnie na serwerze 12 GB/6 vCPU (razem z worker 768m, clamav 3g, db/redis/minio bez
    # jawnego limitu) nie pozwala jednemu
    # przeciekowi pamięci w widoku zjeść całej maszyny i zabrać RAM-u Postgresowi. Bez limitu CPU
    # celowo: pojedynczy proces zajmujący więcej rdzeni pod chwilowym szczytem ruchu nie jest
    # awarią, a dławienie CPU tylko wydłużyłoby czas odpowiedzi każdemu żądaniu naraz.
    mem_limit: 2g
    volumes:
      - static_files:/app/staticfiles
      - package_tmp:/var/tmp/packages
    networks: [edge, internal, cache, mail]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 180 s, nie 40: entrypoint robi migracje i collectstatic **przed** startem gunicorna,
      # a po większych wydaniach (v0.29.1, v0.30.0 – 22.09.2026) trwało to dłużej niż okres
      # rozruchu plus pięć prób. Compose ogłaszał „web unhealthy”, wdrożenie przerywało się
      # na kroku 4b, a kontener wstawał zdrowy pół minuty później – i trzeba było je ponawiać.
      start_period: 180s

  worker:
    <<: *app-base
    command: celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-2} -Q default,scan,mail
    # Patrz komentarz przy `web` – ten sam powód, mniejsza liczba (dwa procesy współbieżne zamiast
    # szesnastu wątków web, a skan antywirusowy trzyma plik w pamięci tylko na czas przesłania do
    # ClamAV, nie cały czas życia procesu).
    mem_limit: 768m
    volumes:
      - package_tmp:/var/tmp/packages
    environment:      # migracje i collectstatic wykonuje tylko web
      <<: *app-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      # Bez puli połączeń: Celery (prefork) zamyka pulę przed i po każdym zadaniu, więc pula
      # byłaby tu droższa niż zwykłe połączenie – uzasadnienie w backend/config/dbpool.py.
      # Połączeniem rządzi wtedy DB_CONN_MAX_AGE (jedno na proces potomny, CELERY_CONCURRENCY).
      DB_POOL: "0"
      DB_APPLICATION_NAME: olimpiada-worker
    depends_on:
      db:     { condition: service_healthy }
      redis:  { condition: service_healthy }
      minio:  { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    <<: *app-base
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:      # migracje i collectstatic wykonuje tylko web
      <<: *app-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      # Jeden wątek, jedno połączenie – pula nie miałaby czego współdzielić (patrz `worker`).
      DB_POOL: "0"
      DB_APPLICATION_NAME: olimpiada-beat
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    # PostgreSQL 18 (do 25.09.2026 był 16). Obraz i wolumen są **parametrami** tylko po to,
    # żeby przejście 16 → 18 i jego wycofanie były jedną linijką w .env, a nie edycją tego pliku
    # na serwerze (którą następne wdrożenie i tak by nadpisało) – docs/OPERACJE.md § 19:
    #   - bez obu zmiennych (instalacja nowa i produkcja po przejściu) – PostgreSQL 18 na
    #     wolumenie `pg18_data`;
    #   - `POSTGRES_IMAGE=postgres:16-alpine` + `POSTGRES_VOLUME=pg_data:/var/lib/postgresql/data`
    #     – stara baza 16 na starym, nietkniętym wolumenie. Tak wygląda serwer, który dostał ten
    #     kod, ale nie przeszedł jeszcze `scripts/upgrade_postgres18.sh` (wpisuje to
    #     `scripts/deploy.sh`, gdy znajdzie wolumen `pg_data` bez `pg18_data`), i tak wygląda
    #     wycofanie (`scripts/upgrade_postgres18.sh --rollback`).
    # Nowy wolumen, a nie ten sam: obraz 18 trzyma dane w `/var/lib/postgresql/18/docker`
    # (PGDATA zależne od wersji) i deklaruje VOLUME `/var/lib/postgresql`, a pliki klastra 16 są
    # nieczytelne dla serwera 18 – przejście to zrzut i odtworzenie, a stary wolumen zostaje
    # nietknięty jako droga powrotu. Montaż całego `/var/lib/postgresql` (nie `…/18/docker`)
    # zgodnie z dokumentacją obrazu: przy następnej wersji głównej dane 19 lądują obok 18 na tym
    # samym wolumenie, co pozwala na `pg_upgrade --link`, gdy baza urośnie za duża na zrzut.
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    # `max_connections` zostaje domyślne (100) – świadomie nie ustawiamy go tu, bo zmiana
    # polecenia tej usługi oznacza restart Postgresa przy wdrożeniu. Budżet aplikacji przy
    # domyślnych wartościach to ok. 20 (web 4×4 z puli, worker 2, beat 1 – docs/OPERACJE.md
    # § 11.2), więc limitu nie trzeba podnosić. Zajętość powyżej 80 % zgłasza watchdog
    # (apps/core/dbconnections.py, `manage.py db_connections`).
    # `max_locks_per_transaction` podniesione z domyślnych 64 do 256 (decyzja organizatora
    # z 25.09.2026): migracje i operacje hurtowe na wielu tabelach (np. zmiana typów kolumn ocen
    # w v0.35.0, testy cofania migracji) potrafią trzymać tysiące blokad w jednej transakcji,
    # a przy domyślnym limicie kończą się „out of shared memory”. Koszt: tablica blokad rośnie
    # o kilka MB pamięci współdzielonej. Zmiana polecenia = restart Postgresa przy wdrożeniu.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=pl_PL.utf8 --encoding=UTF8"
    volumes:
      - ${POSTGRES_VOLUME:-pg18_data:/var/lib/postgresql}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Hasło (`requirepass`) z REDIS_PASSWORD w .env – generuje je scripts/deploy.sh, także na serwerze,
    # którego .env powstał wcześniej. Pusta wartość = `--requirepass ""` = bez hasła (Redis 7 traktuje
    # pusty napis jak brak: `EMPTY_STRING_IS_NULL`, sprawdzone na redis:7-alpine), więc instalacja bez
    # tego wpisu wstaje jak dotąd. Polecenie zaczyna się od `redis-server`, a nie od `sh -c`: entrypoint
    # obrazu zrzuca wtedy uprawnienia do użytkownika `redis` (inne polecenie uruchomiłby jako root).
    # Hasło w argumentach nie wisi w `ps` hosta: Redis nadpisuje swój tytuł procesu
    # („redis-server *:6379”) przy starcie. Widać je w `docker inspect` – ale tam widać i całe .env.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD:-}"
    environment:
      # Tylko dla healthchecku niżej (redis-cli czyta hasło z REDISCLI_AUTH, nie z argumentu).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    # Wyłącznie sieć `cache` (do 1.10.2026 – wspólna `internal`, w której Redis był osiągalny dla
    # każdej usługi: minio, clamav, poczty, djcms, monitora). Redis jest i cache'em, i brokerem
    # Celery – kto go dosięga, ten może wrzucić zadanie do kolejki workera.
    networks: [cache]
    healthcheck:
      # `grep -qx PONG`, a nie sam kod wyjścia: `redis-cli ping` bez hasła odpowiada
      # „NOAUTH Authentication required.” z kodem 0, czyli usługa z hasłem, którego healthcheck nie
      # zna, uchodziłaby za zdrową. REDISCLI_AUTH tylko przy niepustym haśle – puste dawałoby
      # ostrzeżenie „AUTH failed” w każdym przebiegu.
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    # Przy każdym `up` (krok 4b/8 wdrożenia wymienia tę usługę z nazwy, więc zakończony kontener
    # startuje znowu): buckety, polityki anonimowe oraz dwa konta serwisowe z dostępem tylko do
    # własnego bucketu (separacja kryptograficzna mediów publicznych i danych prywatnych). Każdy krok
    # jest idempotentny, więc zmiana polityki w deploy/minio/ dociera na serwer z najbliższym wdrożeniem.
    #
    # Anonimowo `public-media` – WYŁĄCZNIE `s3:GetObject` (deploy/minio/policy-anonymous-public-media.json),
    # a nie gotowe `mc anonymous set download`: tamto daje też `s3:ListBucket`, czyli każdy mógł
    # wylistować wszystkie obiekty bucketu (także dokumenty, do których strona nigdzie nie linkuje).
    # `set-json` zastępuje politykę bucketu w całości – dawna znika przy pierwszym przebiegu.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    logging: *default-logging
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/submissions &&
      mc mb --ignore-existing local/public-media &&
      mc anonymous set none local/submissions &&
      mc anonymous set-json /policies/policy-anonymous-public-media.json local/public-media &&
      mc admin policy create local public-media-rw /policies/policy-public-media.json &&
      mc admin policy create local submissions-rw /policies/policy-submissions.json &&
      (mc admin user info local $$S3_PUBLIC_ACCESS_KEY >/dev/null 2>&1 || mc admin user add local $$S3_PUBLIC_ACCESS_KEY $$S3_PUBLIC_SECRET_KEY) &&
      (mc admin user info local $$S3_PRIVATE_ACCESS_KEY >/dev/null 2>&1 || mc admin user add local $$S3_PRIVATE_ACCESS_KEY $$S3_PRIVATE_SECRET_KEY) &&
      (mc admin policy attach local public-media-rw --user $$S3_PUBLIC_ACCESS_KEY || true) &&
      (mc admin policy attach local submissions-rw --user $$S3_PRIVATE_ACCESS_KEY || true) &&
      echo done"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_PUBLIC_ACCESS_KEY: ${S3_PUBLIC_ACCESS_KEY}
      S3_PUBLIC_SECRET_KEY: ${S3_PUBLIC_SECRET_KEY}
      S3_PRIVATE_ACCESS_KEY: ${S3_PRIVATE_ACCESS_KEY}
      S3_PRIVATE_SECRET_KEY: ${S3_PRIVATE_SECRET_KEY}
    volumes:
      - ./deploy/minio:/policies:ro
    networks: [internal]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    logging: *default-logging
    # Baza sygnatur (`freshclam`) trzyma się w pamięci procesu skanującego, nie tylko na dysku –
    # 3g, nie 2g jak `web`: w spoczynku ClamAV zajmuje ~950 MB, a przy przeładowaniu sygnatur
    # (freshclam) trzyma przez chwilę starą i nową bazę naraz, czyli blisko 2 GB – limit 2g kończyłby
    # się wtedy zabiciem procesu, a więc cichą odmową skanów. Poniżej ~1 GB ClamAV w ogóle nie
    # załaduje pełnej bazy i skanowanie
    # zaczyna cicho zawodzić zamiast tylko wolniej działać. Patrz komentarz przy `web` w sprawie
    # `mem_limit` kontra `deploy.resources` i braku limitu CPU.
    mem_limit: 3g
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_db:/var/lib/clamav
    # `internal` – tu sięgają go web i worker (clamav:3310). `clamav_egress` – wyjście do internetu dla
    # freshclam: sama `internal` ma internal:true, więc do 1.10.2026 każda aktualizacja sygnatur
    # kończyła się błędem i skaner pracował na bazie z dnia startu kontenera (na produkcji – sprzed
    # 25 dni). Osobna sieć, a nie `edge`: `edge` jest w TRUSTED_PROXY_IPS aplikacji i w `mynetworks`
    # Postfiksa, a ClamAV nie ma powodu być ani zaufanym proxy, ani klientem relaya; w `clamav_egress`
    # nie stoi nic innego. Portów nie publikujemy – sieć daje wyłącznie ruch wychodzący.
    networks: [internal, clamav_egress]
    # Bezpieczne przy tym obrazie: /init (entrypoint clamav/clamav:1.4, przeczytany 1.10.2026) biegnie
    # jako root i robi wyłącznie install/chown/sed, a uprawnienia zrzucają same procesy (`freshclam
    # --user=clamav`, clamd) wywołaniem setuid() z roota – bez pliku z bitem setuid i bez capabilities
    # plikowych, czyli bez niczego, co no-new-privileges blokuje. Sprawdzone 1.10.2026 na tym obrazie
    # z tą opcją: `NoNewPrivs: 1`, freshclam i clamd jako nie-root, freshclam połączył się z mirrorem,
    # `clamdcheck.sh` → „Clamd is up”.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s   # pierwsze pobranie sygnatur trwa kilka minut

  mail:
    # Własny MTA wychodzący (send-only relay) – bez zewnętrznego dostawcy poczty transakcyjnej.
    # Przyjmuje pocztę na 587 wyłącznie z sieci compose i doręcza ją wprost do MX-ów odbiorców
    # (RELAYHOST pusty). Podpisuje DKIM-em kluczem wygenerowanym przy pierwszym starcie.
    #
    # v5.1.0 to ostatnie wydanie z OpenDKIM (v6 przechodzi na rspamd i inne ścieżki kluczy) –
    # wersja jest przypięta świadomie, bo migracja zmienia lokalizację wolumenu z kluczami.
    image: boky/postfix:v5.1.0-alpine
    restart: unless-stopped
    logging: *default-logging
    # HELO/EHLO i myhostname. Musi zgadzać się z rekordem PTR adresu wyjściowego, inaczej
    # Gmail/Outlook odrzucają połączenie jeszcze przed sprawdzeniem SPF.
    hostname: mail.${SITE_DOMAIN:-localhost}
    environment:
      # Postfix przyjmie kopertę tylko dla nadawcy z tej domeny (nie jest open relayem nawet
      # dla kogoś, kto trafi do sieci compose).
      ALLOWED_SENDER_DOMAINS: ${SITE_DOMAIN:-localhost}
      POSTFIX_myhostname: mail.${SITE_DOMAIN:-localhost}
      # Klienci SMTP: wyłącznie sieć `mail` (web, worker, beat – nikt więcej w niej nie stoi). Bez
      # SASL – poza tą siecią port 587 nie jest osiągalny (brak `ports:`, Postfix nie stoi już
      # w `edge` ani w `internal`), więc hasło niczego by nie dodało. Do 10.10.2026 brała tu tę samą
      # listę co TRUSTED_PROXY_IPS (podsieci `edge` i `internal`), czyli przekaźnikiem z prawdziwym
      # podpisem DKIM domeny mógł się posłużyć także djcms, monitor, minio, clamav i `jitsi-web`
      # (audyt bezpieczeństwa 10.10.2026, S20). Podsieć = ta z sekcji `networks:` (`MAIL_SUBNET`).
      POSTFIX_mynetworks: 127.0.0.0/8,${MAIL_SUBNET:-172.30.5.0/24}
      # TLS do MX-a odbiorcy oportunistycznie: szyfruj, gdy druga strona ogłosi STARTTLS,
      # ale nie odrzucaj listu, gdy nie ogłosi (`encrypt` zablokowałby część odbiorców).
      POSTFIX_smtp_tls_security_level: may
      # Jedna linia na doręczenie („TLS connection established to …”) – bez tego z logu nie widać,
      # czy list poszedł szyfrowany, a przy `may` nie ma o tym żadnej innej informacji.
      POSTFIX_smtp_tls_loglevel: "1"
      # Limit rozmiaru koperty (obraz domyślnie nie ma żadnego). Do 20.09.2026 stało tu 10 MB,
      # bo aplikacja wysyłała wyłącznie krótkie listy transakcyjne. Od przekazywania przyjętych
      # rozwiązań na skrzynkę organizatora (`Competition.submission_forward_emails`) jeden rodzaj
      # listu niesie **załącznik**: plik do `SUBMISSION_FORWARD_MAX_ATTACHMENT_MB` (domyślnie
      # 20 MB), a kodowanie base64 rozdyma go o około 37 % — czyli koperta sięga ~28 MB.
      # 40 MiB zostawia zapas na nagłówki i na podniesienie tamtego ustawienia do granicy uploadu
      # (25 MB → ~34 MB koperty). Limit **musi** być wyższy od wyniku tego mnożenia: odrzucenie
      # przez relay widać dopiero w logu workera, a organizator nie dostaje wtedy nic.
      POSTFIX_message_size_limit: "41943040"
      # Sieć docker-bridge nie ma IPv6; bez tego Postfix próbuje rekordów AAAA i czeka na timeout.
      POSTFIX_inet_protocols: ipv4
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: olimpiada
      TZ: Europe/Warsaw
    volumes:
      # Klucz DKIM przeżywa `docker compose down` – inaczej po każdym restarcie trzeba by
      # aktualizować rekord TXT w DNS-ie.
      - mail_dkim:/etc/opendkim/keys
      - mail_spool:/var/spool/postfix
    # `mail` – tu sięgają web/worker/beat (i wyłącznie oni). `mail_egress` – wyjście na świat do MX-ów
    # odbiorców (sama `mail` ma internal:true); w `mail_egress` nie stoi nic innego, tak jak ClamAV
    # w `clamav_egress`. Do 10.10.2026 Postfix stał w `edge` i `internal`. Celowo nie w `edge`: web
    # też tam stoi, a nazwa `mail` rozwiązywałaby się wtedy raz na adres z `edge`, raz z `mail` –
    # połączenie z adresu `edge` relay by odrzucił (`mynetworks`). Portów nie publikujemy.
    networks: [mail, mail_egress]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Minimum dla Postfiksa: master startuje jako root i zrzuca uprawnienia do postfix/opendkim
    # (SETUID/SETGID), pilnuje właściciela kolejki (CHOWN/FOWNER/DAC_OVERRIDE), wchodzi do chroota
    # /var/spool/postfix (SYS_CHROOT) i ubija procesy potomne przy reloadzie (KILL).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SYS_CHROOT, KILL]
    healthcheck:
      test: ["CMD-SHELL", "/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  monitor:
    # Monitoring zewnętrzny (Uptime Kuma) – patrz deploy/monitoring/README.md.
    #
    # Profil `monitoring`, czyli usługa **nie** wstaje przy zwykłym `docker compose up`: organizator
    # włącza ją świadomie (`docker compose --profile monitoring up -d monitor`), bo wystawia kolejną
    # domenę z własnym logowaniem i własną bazą kont.
    #
    # Uczciwe ostrzeżenie, którego nie da się obejść konfiguracją: monitor stojący na tej samej
    # maszynie, co serwis, nie zauważy awarii tej maszyny – powie o niej tylko wtedy, gdy padnie
    # sam serwis, a nie host, sieć albo zasilanie. Dlatego to jest **druga** linia, a pierwszą
    # zostaje watchdog aplikacyjny (apps/core/alerts.py, list z serwera) plus dowolny zewnętrzny
    # monitor odpytujący /status.json spoza tego serwera. Docelowo ta usługa powinna stać u innego
    # dostawcy; compose jest tu po to, żeby dało się zacząć od czegokolwiek w piętnaście minut.
    profiles: [monitoring]
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - monitor_data:/app/data
    # `internal` – żeby pukać w `web:8000` i `minio:9000` z tej samej sieci, w której stoją
    # (sprawdzenie „czy usługa żyje” nie ma przechodzić przez Caddy'ego; wtedy testowałoby proxy).
    # `edge` – żeby Kuma mogła wyjść na świat z powiadomieniem (Telegram) i sprawdzić adres
    # publiczny, oraz żeby Caddy ją zobaczył pod nazwą `monitor`.
    networks: [internal, edge]
    security_opt:
      - no-new-privileges:true

  djcms:
    # Wersja porównawcza serwisu na django CMS pod dj.<SITE_DOMAIN> (docs/tasks/DJ-01.md).
    # Profil `djcms` = usługa **nie** wstaje przy zwykłym `docker compose up`; włącza ją świadomie
    # `DJCMS_ENABLED=1` (scripts/deploy.sh) albo ręcznie `--profile djcms`. Bez profilu zestaw usług,
    # konfiguracja pozostałych usług i przebieg wdrożenia są takie jak przed DJ-01
    # (scripts/tests/compose_profiles_test.sh).
    #
    # Zmienne **bez** `${…:?}`: interpolacja obejmuje cały plik niezależnie od profilu, więc
    # wymagalna zmienna wywróciłaby `docker compose config` każdemu, kto djcms nie używa. Brak
    # sekretu wykrywa djcms sam przy starcie (djcms/config/settings/production.py).
    #
    # Rozdział sekretów (reguła 11): **bez** `env_file: .env` – wyłącznie jawna lista niżej. Djcms
    # nie dostaje ani DJANGO_SECRET_KEY, ani poświadczeń bazy aplikacji głównej, MinIO czy Redisa;
    # ma własną rolę Postgresa `olimpiada_djcms` (scripts/djcms_db.sh) bez praw do bazy `olimpiada`.
    profiles: [djcms]
    build:
      context: .
      dockerfile: djcms/Dockerfile
      target: runtime
    image: ${DJCMS_IMAGE:-olimpiada/djcms:${APP_VERSION:-dev}}
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${DJCMS_WORKERS:-3} --threads ${DJCMS_THREADS:-4}
      --worker-class gthread --timeout 60 --graceful-timeout 20 --access-logfile -
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJCMS_SECRET_KEY: ${DJCMS_SECRET_KEY:-}
      DATABASE_URL: postgres://olimpiada_djcms:${DJCMS_DB_PASSWORD:-}@db:5432/olimpiada_djcms
      # Hosty djcms (DJ-02 § 5.4): te same zmienne co aplikacja główna – djcms odpowiada pod każdym
      # hostem konkursu (+ dj.<SITE_DOMAIN>). DJCMS_ALLOWED_HOSTS tylko dokłada wpisy.
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
      PLATFORM_SUBDOMAINS: ${PLATFORM_SUBDOMAINS:-0}
      DJCMS_ALLOWED_HOSTS: dj.${SITE_DOMAIN:-localhost},127.0.0.1,localhost
      DJCMS_CSRF_TRUSTED_ORIGINS: https://dj.${SITE_DOMAIN:-localhost}
      DJCMS_MAIN_API_URL: http://web:8000/internal/djcms/v2/
      DJCMS_INTERNAL_TOKEN: ${DJCMS_INTERNAL_TOKEN:-}
      # Klucz tokenu SSO z `/cms/` (DJ-02 D6) – ten sam wpis `.env` czyta `web` (env_file).
      DJCMS_SSO_KEY: ${DJCMS_SSO_KEY:-}
      # Najdłuższa sesja redaktora po SSO (sekundy od logowania; potem powrót przez `/cms/`).
      DJCMS_SSO_SESSION_SECONDS: ${DJCMS_SSO_SESSION_SECONDS:-7200}
      DJCMS_MAIN_MEDIA_ORIGIN: ${S3_PUBLIC_ENDPOINT_URL:-https://s3.${SITE_DOMAIN:-localhost}}
      # Zaufane proxy = WYŁĄCZNIE kontener `proxy` (Caddy): od niego djcms przyjmuje `X-Real-IP`
      # (blokada prób logowania) i `X-Djcms-Mode` (tryb preview/primary, DJ-02 D10 – od tego zależy
      # noindex). Nie całe podsieci compose'a (jak do 10.10.2026 `TRUSTED_PROXY_IPS` aplikacji głównej): w sieci
      # `internal` stoją też web, worker, minio, clamav, mail… i każdy z nich mógłby udawać Caddy'ego.
      # Adres `proxy` w sieci `internal` przypina usługa `proxy` wyżej (od 10.10.2026 zawsze) – ta sama
      # zmienna, ta sama wartość domyślna (scripts/tests/compose_profiles_test.sh pilnuje zgodności).
      TRUSTED_PROXY_IPS: ${DJCMS_PROXY_IP:-172.30.2.250}
    volumes:
      - djcms_media:/app/media
    # Tylko `internal` (bez wyjścia do internetu): djcms rozmawia wyłącznie z `db` i z API `web`.
    networks: [internal]
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    # `/tmp` zapisywalny: bufor plikowy blokady logowania (djcms/apps/pages/auth.py) i pliki
    # tymczasowe uploadu filera.
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # DJ-02 § 10.6: serwis publiczny wszystkich konkursów – domyślnie 3 workery gthread × 4 wątki
    # (DJCMS_WORKERS/DJCMS_THREADS w .env), ~200 MB na worker z zapasem. Budżet połączeń
    # Postgresa: +≤ 12 (3×4, CONN_MAX_AGE=0) przy max_connections=100.
    mem_limit: 768m
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # /djcms/healthz/ sprawdza wyłącznie bazę djcms – nie API aplikacji głównej (niedostępny `web`
      # to degradacja sekcji żywych, a nie powód do restartu djcms) i nie rejestr konkursów.
      # Wszystkie adresy aplikacyjne djcms są pod /djcms/ (DJ-02 D2).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/djcms/healthz/', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  mailpit:
    profiles: [dev]
    image: axllent/mailpit:v1.24
    logging: *default-logging
    # Wyłącznie na pętli zwrotnej hosta: podgląd poczty deweloperskiej (z linkami aktywacji i resetu
    # hasła) nie ma być widoczny z sieci, w której stoi laptop – tak jak porty z docker-compose.dev.yml.
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
  internal:
    driver: bridge
    internal: true   # brak wyjścia do internetu z usług danych; web ma wyjście przez `edge`
    ipam:
      config:
        - subnet: 172.30.2.0/24
  # Redis (cache + broker Celery) i wyłącznie jego klienci: web, worker, beat. Bez wyjścia do
  # internetu. Nie należy do TRUSTED_PROXY_IPS ani do `mynetworks` Postfiksa (komentarz w x-app-env).
  cache:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.3.0/24
  # Wyjście do internetu dla ClamAV-a (freshclam – aktualizacje sygnatur). Jedyny członek: `clamav`.
  # Nie `internal` (to jest cały jej sens) i nie w TRUSTED_PROXY_IPS / `mynetworks`.
  clamav_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.4.0/24
  # Relay poczty (usługa `mail`) i wyłącznie jego klienci: web, worker, beat (audyt 10.10.2026, S20).
  # Bez wyjścia do internetu. Ta podsieć – i tylko ona – jest `mynetworks` Postfiksa, więc zmienna
  # MAIL_SUBNET (w .env zwykle nieustawiona) przesuwa obie rzeczy naraz. Nie należy do TRUSTED_PROXY_IPS.
  mail:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${MAIL_SUBNET:-172.30.5.0/24}
  # Wyjście do internetu dla Postfiksa (doręczenie wprost do MX-ów odbiorców). Jedyny członek: `mail`.
  mail_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.6.0/24
  # Proxy ⇄ `jitsi-web` (osobny projekt compose, deploy/jitsi/docker-compose.jitsi.yml dołącza do niej
  # jako sieci zewnętrznej `<projekt>_meet`). Do 10.10.2026 `jitsi-web` (cudzy kod, root, bez
  # `cap_drop`) stał w `edge` – obok web, monitora i poczty, z adresem z podsieci, której ufały
  # TRUSTED_PROXY_IPS i `mynetworks`. Tu widzi wyłącznie Caddy'ego. Bez wyjścia do internetu:
  # `jitsi-web` ma je przez własną sieć `meet.jitsi`. Sieć powstaje razem z `proxy`, więc istnieje,
  # zanim scripts/deploy_jitsi.sh postawi Jitsi.
  meet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.7.0/24

volumes:
  # PostgreSQL 18 – dane bazy (patrz komentarz przy usłudze `db`).
  pg18_data:
  # PostgreSQL 16 – dane sprzed przejścia na 18. Zadeklarowany dalej, bo jest drogą
  # wycofania (`POSTGRES_VOLUME=pg_data:/var/lib/postgresql/data`). Na nowej instalacji compose
  # go nie zakłada, dopóki żadna usługa go nie montuje. Skasowanie po okresie próbnym:
  # docs/OPERACJE.md § 19.6.
  pg_data:
  redis_data:
  minio_data:
  clamav_db:
  mail_dkim:
  mail_spool:
  static_files:
  # Katalog roboczy paczek do pobrania (PACKAGE_TMP_DIR w `x-app-env`) – web i worker.
  package_tmp:
  caddy_data:
  caddy_config:
  # Baza Uptime Kuma (monitory, historia, konta). Wolumen nazwany, bo historia dostępności jest
  # jedyną rzeczą, która po incydencie odpowiada na pytanie „jak długo to nie działało”.
  monitor_data:
  # Pliki wgrane przez redaktorów djcms (filer). Compose zakłada wolumen dopiero wtedy, gdy montuje
  # go uruchamiana usługa – bez profilu `djcms` nie powstaje.
  djcms_media:
