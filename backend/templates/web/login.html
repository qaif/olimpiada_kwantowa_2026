{% extends "base.html" %}
{% block title %}Logowanie{% endblock %}
{% block content %}
<h1>Logowanie</h1>
<form method="post" class="stack">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Zaloguj</button>
</form>
<p>Nie masz konta? <a href="{% url 'web:register' %}">Zarejestruj się</a>.</p>
{% endblock %}
