{% load i18n %}
{# Fragment zwracany przez HTMX po zapisie szkicu. #}
<div id="draft-status" role="status">
  {% if error %}
    <span class="msg msg-error">{{ error }}</span>
  {% elif saved %}
    <span class="msg msg-success">{% blocktranslate trimmed with status=review.get_status_display %}
      Szkic zapisany (status: {{ status }}).
    {% endblocktranslate %}</span>
  {% endif %}
</div>
