[project]
name = "olimpiada"
version = "0.1.0"
description = "Platforma olimpiady: etapy, upload rozwiązań, ocenianie 0-2-5-6, reklamacje, CMS"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "drf-spectacular>=0.27,<0.29",
    "django-environ>=0.11,<0.13",
    "psycopg[binary]>=3.2,<3.3",
    "redis>=5.0,<6.0",
    "django-redis>=5.4,<6.0",
    "celery>=5.4,<5.6",
    "django-celery-beat>=2.7,<2.9",
    "gunicorn>=23.0,<24.0",
    "uvicorn[standard]>=0.30,<0.36",
    "django-storages[s3]>=1.14,<1.15",
    "boto3>=1.35,<2.0",
    "nbformat>=5.10,<6.0",
    "whitenoise>=6.7,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "S105", "S106"]  # assert w testach, "hasła" w fixture'ach

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = ["slow: testy wymagające zewnętrznych usług"]
