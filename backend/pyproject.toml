[project]
name = "olimpiada"
version = "0.1.0"
description = "Platforma olimpiady: etapy, upload rozwiązań, ocenianie 0-2-5-6, reklamacje, CMS"
# Licencja całego repozytorium: pełny tekst w pliku ``LICENSE`` w korzeniu, uzasadnienie wyboru
# w ``docs/LICENCJA-UZASADNIENIE.md``. Zapis tabelą (``{ text = … }``), a nie samym napisem, bo
# tak wymaga PEP 621 — a pyproject czyta tu uv, nie budowanie pakietu.
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    # Django 6.1 (v0.26.0). Wymaga Pythona ≥ 3.12 (obraz ma 3.12) i PostgreSQL-a ≥ 15
    # (compose i produkcja mają 16) – obie granice są spełnione z zapasem. Górna granica przy
    # następnej wersji mniejszej, jak wszędzie w tym pliku: łatki (6.1.x) wchodzą same,
    # a przeskok na 6.2 ma być świadomą decyzją i osobnym przebiegiem testów.
    "django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.30,<0.31",
    # 0.14: pierwsze wydanie deklarujące zgodność z Django 6.x. Wcześniejsze linie działały,
    # ale nie były testowane przeciwko 6.1 – a to ten pakiet czyta ``DATABASE_URL``/``EMAIL_URL``,
    # czyli całą konfigurację środowiska.
    "django-environ>=0.14,<0.15",
    "psycopg[binary]>=3.2,<3.3",
    "redis>=5.0,<6.0",
    # 7.0: pierwsza linia z ``Django>=5.2`` w metadanych; 5.4 nie instaluje się obok Django 6.1.
    "django-redis>=7.0,<7.1",
    "celery>=5.6,<5.7",
    # UWAGA – override w ``[tool.uv]`` na końcu pliku. ``django-celery-beat`` 2.9.0 (najnowsze
    # wydanie, sprawdzone na PyPI 18.09.2026) deklaruje ``Django<6.1`` i bez obejścia blokuje
    # rozwiązanie zależności. Deklaracja jest zbyt ostrożna, a nie prawdziwa: pakiet działa
    # na 6.1 (dowód w docs/OPERACJE.md – migracje, ``DatabaseScheduler``, panel zadań
    # okresowych, synchronizacja ``CELERY_BEAT_SCHEDULE``). Override znika w dniu, w którym
    # ukaże się wydanie z ``Django<6.2`` (albo bez górnej granicy) – wtedy ta linia i sekcja
    # ``[tool.uv]`` mają wypaść razem.
    "django-celery-beat>=2.9,<2.10",
    "gunicorn>=23.0,<24.0",
    "uvicorn[standard]>=0.30,<0.36",
    "django-storages[s3]>=1.14,<1.15",
    "boto3>=1.35,<2.0",
    "nbformat>=5.10,<6.0",
    "whitenoise>=6.7,<7.0",
    # CMS in-process (PROJEKT.md 1.1). 8.0 to pierwsza linia zgodna z Django 6.1 (metadane:
    # ``Django>=5.2``, klasyfikatory 5.2/6.0/6.1); poprzednia 6.3 była linią LTS zgodną
    # z Django 5.1 i z Django 6 się nie instaluje.
    "wagtail>=8.0,<8.1",
    # Logowanie przez Google/Facebook. Używamy **wyłącznie** części socialaccount – lokalne
    # widoki allauth (hasłowe logowanie i rejestracja) nie są montowane, patrz apps/web/social_urls.py.
    # Ekstra ``socialaccount`` dociąga ``requests``/``requests-oauthlib`` (OAuth2 + PKCE).
    "django-allauth[socialaccount]>=65.19,<66.0",
    # CAPTCHA na publicznych formularzach rejestracji. Obrazek generuje Pillow (ten sam, którego
    # używa Wagtail), wyzwanie leży w naszej bazie, a obrazek jest serwowany spod naszego adresu:
    # nie ma tu żadnego trzeciego podmiotu ani ciasteczka, czyli polityka cookies zostaje prawdziwa.
    # 0.7: pierwsze wydanie deklarujące Django 6.x. Linia 0.6 ma w metadanych ``Django<5.2``,
    # więc przy Django 6.1 nie da się jej zainstalować.
    "django-simple-captcha>=0.7,<0.8",
    # Arkusze .xlsx w obie strony: odczyt wykazu SIO przy budowaniu słownika szkół
    # (``apps.schools.sio``) i zapis eksportów koordynatora (``apps.core.exports``). Zależność
    # była wcześniej w ekstrze ``dev``, bo czytał ją wyłącznie import słownika uruchamiany ręcznie.
    # Eksport działa w panelu, czyli na produkcji – biblioteka musi więc być w zwykłych
    # zależnościach, a nie tylko tam, gdzie akurat instaluje się także narzędzia deweloperskie.
    # (Wagtail ciągnie openpyxl tranzytywnie, ale zależność, na której stoi nasz kod, ma być
    # nazwana wprost – inaczej usunięcie jej z Wagtaila wywróciłoby eksport bez ostrzeżenia.)
    "openpyxl>=3.1,<4.0",
    # Skład dyplomów i zaświadczeń (``apps.results.certificates``). Zależność zwykła, a nie dev:
    # dokument wystawia koordynator w panelu na produkcji, a uczestnik pobiera go ze swojego
    # panelu. Kroje DejaVu są w repozytorium (``backend/static/fonts/``) razem z licencją –
    # wbudowane w reportlab fonty Type1 nie mają polskich znaków diakrytycznych, więc bez nich
    # „Zaświadczenie dla Łucji Śniadeckiej” składałoby się z czarnych prostokątów.
    #
    # 5.x (v0.26.1). Do v0.26.0 stała tu granica ``<5`` i produkcja składała dokumenty
    # **reportlabem 4.5.1**, podczas gdy obraz deweloperski niósł już 5.0.1 – czyli testy PDF-ów
    # sprawdzały bibliotekę, której produkcja nie uruchamiała. Ta linia zdejmuje ten rozjazd,
    # a nie dokłada możliwości: 5.0 to z naszego punktu widzenia 4.5.1 plus jedna zmiana
    # bezpieczeństwa (``rl_config.trustedHosts=None`` znaczy teraz „żaden host nie jest zaufany”,
    # a nie „wszystkie”) i dwa usunięte zaplecza opcjonalne (``rl_renderPM``, ``pyRXP``). Żadna
    # z tych rzeczy nas nie dotyczy: obrazy podajemy zawsze jako ``ImageReader(BytesIO(...))``,
    # a nie adresem, więc ``open_for_read`` nigdy nie wychodzi do sieci; bitmap nie renderujemy
    # i XML-a reportlabem nie parsujemy. Sprawdzone porównaniem dokumentów, nie deklaracją:
    # dwanaście dokumentów (pięć rodzajów dyplomu, dyplom na szablonie graficznym z tłem, logo,
    # trzema podpisami i QR-em, wzór zgody opiekuna, protokół etapu, trzy listy logistyczne
    # i rachunek) złożonych oboma wersjami z tych samych danych wychodzi **bajt w bajt** tak samo
    # (docs/OPERACJE.md § 9.6). Górna granica stoi tam, gdzie stała dotąd – przy następnej wersji
    # głównej: łatki i wydania 5.x wchodzą same, a przeskok na 6 ma być osobnym przebiegiem
    # tego samego porównania.
    "reportlab>=5.0,<6",
    # Liczba stron PDF-a oddanego przez uczestnika (``apps.submissions.preview``). Czytamy
    # **wyłącznie** tablicę stron – biblioteka niczego nie renderuje i nie wykonuje, a sam odczyt
    # idzie dopiero po czystym skanie antywirusowym. W zwykłych zależnościach, a nie w ekstrze
    # dev, bo liczbę stron pokazuje panel uczestnika, czyli produkcja.
    "pypdf>=4,<6",
    # Pieczęć elektroniczna dokumentów w formacie PAdES (``apps.results.signing``). W zwykłych
    # zależnościach, bo podpisuje **produkcja** – dokument powstaje przy każdym pobraniu i to
    # wtedy trafia na niego pieczęć. Sama funkcja jest jednak wyłączona, dopóki nie ma klucza
    # (``CERT_SIGN_P12_PATH``): bez niego moduł oddaje plik bez zmian, a import biblioteki
    # w ogóle nie następuje – jest leniwy, wewnątrz funkcji podpisującej.
    "pyhanko>=0.21,<1",
    # Ocena AI (``apps.ai_grading``) – oficjalne SDK Anthropic. W zwykłych zależnościach, bo sugestie
    # liczy worker produkcyjny; funkcja jest jednak domyślnie wyłączona (flaga ``ai_grading``),
    # a import biblioteki jest leniwy – wewnątrz ``apps.ai_grading.client`` – więc konkurs bez
    # oceny AI nie ładuje jej nigdy. Linia 1.x: pierwsza z parametrami ``fallbacks`` i
    # ``output_config`` w ``beta.messages.stream`` (sprawdzone na 1.8.0 z 24.09.2026). Górna granica
    # przy następnej wersji głównej, jak wszędzie w tym pliku.
    "anthropic>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    # Dzieli zbiór testów na równe części dla shardów `pytest` w CI (`.github/workflows/ci.yml`,
    # job `tests`, `--splits`/`--group`). Bez pliku `.test_durations` dzieli po liczbie testów,
    # nie po zmierzonym czasie – patrz komentarz przy jobie.
    "pytest-split>=0.10,<1.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.6",
    # Skład PDF-ów zadań treningowych (``apps.competitions.training_pdf`` i wołający go skrypt
    # ``scripts/build_training_problem_pdfs.py``). Świadomie **tylko** w ekstrze dev: gotowe PDF-y
    # leżą w repozytorium, a produkcja je wgrywa, więc obraz produkcyjny nie musi umieć składać
    # dokumentów. Import biblioteki w module jest leniwy, a test generatora sam się pomija
    # (``pytest.importorskip``), więc brak ekstry dev niczego nie psuje.
]

# --- obejście zależności dla resolvera (uv) ----------------------------------------------------
# Jedyny wpis i jedyny powód: ``django-celery-beat`` 2.9.0 – najnowsze wydanie na dzień
# 18.09.2026 – deklaruje ``Django<6.1,>=2.2``. Górna granica jest w tym pakiecie od lat stawiana
# na „ostatnie Django, jakie autorzy zdążyli przetestować”, a nie na faktyczną niezgodność:
# 2.9.0 uruchamia się na Django 6.1 bez jednej zmiany (migracje aplikują się, ``DatabaseScheduler``
# startuje, panel zadań okresowych renderuje się, wpisy z ``CELERY_BEAT_SCHEDULE`` synchronizują
# się do bazy – procedura sprawdzenia w docs/OPERACJE.md, „Aktualizacja frameworka (v0.26.0)”).
# Bez tego wpisu ``uv pip install -r pyproject.toml`` w ``backend/Dockerfile`` kończy się
# „ResolutionImpossible”, czyli obraz produkcyjny w ogóle się nie buduje.
#
# Wpis mówi resolverowi: „na Django patrz **tu**, a nie na to, czego żąda pakiet”. Dlatego
# override dotyczy ``django``, a nie ``django-celery-beat`` – nadpisuje się deklarację, która
# blokuje, a nie pakiet, który ją napisał. Zakres jest dokładnie ten sam, co pin w
# ``dependencies`` wyżej, więc nie poszerza niczego: wagtail i DRF żądają ``Django>=5.2``,
# a 6.1 to spełnia.
#
# Warunek usunięcia (jeden, sprawdzalny): pierwsze wydanie ``django-celery-beat``, które w
# metadanych dopuszcza Django 6.1 (``Django<6.2`` albo bez górnej granicy). Wtedy znika ta sekcja
# **i** ostrzeżenie przy pinie w ``dependencies`` wyżej – obie rzeczy naraz, bo opisują to samo.
[tool.uv]
override-dependencies = ["django>=6.1,<6.2"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "S105", "S106"]  # assert w testach, "hasła" w fixture'ach

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
# --ds jest konieczne, bo w kontenerach compose ustawia DJANGO_SETTINGS_MODULE=config.settings.production,
# a w pytest-django zmienna środowiskowa ma pierwszeństwo przed ini. Bez tego testy szłyby na prawdziwy
# MinIO/Redis i nie miałyby CELERY_TASK_ALWAYS_EAGER.
addopts = "-ra --strict-markers -p no:cacheprovider --ds=config.settings.test"
markers = ["slow: testy wymagające zewnętrznych usług"]
