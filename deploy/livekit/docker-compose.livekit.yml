# LiveKit na TYM SAMYM hoście co portal – wariant (b) dla małych spotkań (zadanie WEB-01,
# docs/OPERACJE.md § 28). Na duże wydarzenia: osobna maszyna (wariant (a)) – tam ten plik służy jako
# wzór, a portal dostaje tylko LIVEKIT_URL i klucze.
#
# Nakładka z profilem `livekit`: przy zwykłym `docker compose up` (scripts/deploy.sh) NIE wstaje nic
# z tego pliku – ani nie jest on w ogóle czytany. Uruchomienie świadome, z katalogu /opt/olimpiada:
#
#   docker compose -f docker-compose.yml -f deploy/livekit/docker-compose.livekit.yml \
#     --profile livekit up -d livekit livekit-egress livekit-redis
#
# Konfiguracja w plikach obok (kopie przykładów, poza repozytorium – zawierają sekrety):
#   /opt/olimpiada/livekit/livekit.yaml  ← deploy/livekit/livekit.yaml.example
#   /opt/olimpiada/livekit/egress.yaml   ← deploy/livekit/egress.yaml.example
# Ścieżki względne liczą się od katalogu projektu (pierwszy plik -f), czyli /opt/olimpiada.
#
# Sieci (poprawka po przeglądzie – `edge` i `internal` są zaufane: TRUSTED_PROXY_IPS aplikacji
# i `mynetworks` Postfiksa, więc nie stoi w nich nic poza usługami, którym ta reguła ufa):
#   - `livekit` (wewnętrzna): serwer ↔ egress ↔ ich Redis. Redis LiveKit jest OSOBNY od Redisa
#     aplikacji (ten ma hasło i dane Celery),
#   - `livekit_signal` (zadeklarowana w docker-compose.yml, bo należy do niej Caddy): sygnalizacja
#     `live.<domena>` → `livekit:7880` i wyjście do internetu – STUN, webhooki do portalu (adres
#     publiczny), a dla egressu: dołączenie do pokoju (adres publiczny z `use_external_ip`) i zapis
#     MP4 do S3 platformy przez publiczny adres (`S3_PUBLIC_ENDPOINT_URL`). Egress NIE stoi w
#     `internal`, więc nie widzi ani bazy, ani `web`, ani poczty, ani MinIO od środka.
# Media (UDP 50000–50100, TCP 7881) idą z pominięciem Caddy'ego, przez porty opublikowane przez
# Dockera. UWAGA: Docker dopisuje własne reguły iptables przed ufw – `ufw deny` tych portów NIE
# zamknie; zamyka je wyłącznie zdjęcie `ports:` albo reguła w łańcuchu DOCKER-USER (docs/OPERACJE.md
# § 28.3). Sieć mostkowa zamiast `network_mode: host`: host dałby LiveKitowi dostęp do wszystkich
# usług hosta i do portów compose'a na 127.0.0.1, a odciąłby go od nazwy `livekit` w sieci Caddy'ego;
# ceną mostka jest docker-proxy na 101 portów – przy 100 portach UDP to akceptowalne (więcej = wariant (a)).
services:
  livekit-redis:
    profiles: [livekit]
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks: [livekit]
    security_opt: ["no-new-privileges:true"]

  livekit:
    profiles: [livekit]
    # Wersja przypięta (jak Jitsi `stable-11031`): aktualizacja to świadoma zmiana tej zmiennej
    # i próba na serwerze testowym, nie skutek `pull`.
    image: livekit/livekit-server:${LIVEKIT_SERVER_VERSION:-v1.13.7}
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    networks: [livekit_signal, livekit]
    depends_on: [livekit-redis]
    security_opt: ["no-new-privileges:true"]

  livekit-egress:
    profiles: [livekit]
    image: livekit/egress:${LIVEKIT_EGRESS_VERSION:-v1.14.1}
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml:ro
    # Egress składa nagranie w Chrome bez okna. Piaskownicę Chrome włącza profil seccomp z
    # repozytorium egress (`chrome-sandboxing-seccomp-profile.json`, README egress) – węższy niż
    # dawne `cap_add: SYS_ADMIN`. Plik kładzie operator obok konfiguracji (docs/OPERACJE.md § 28.2);
    # bez niego kontener nie wystartuje, zamiast cicho nagrywać bez piaskownicy.
    security_opt:
      - seccomp=./livekit/chrome-sandboxing-seccomp-profile.json
    networks: [livekit, livekit_signal]
    depends_on: [livekit, livekit-redis]

networks:
  livekit:
    driver: bridge
    internal: true
