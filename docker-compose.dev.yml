# Override developerski: kod z hosta montowany do kontenera, zapis dozwolony, porty pomocnicze.
# Użycie: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  web:
    read_only: false
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
    environment:
      DJANGO_DEBUG: "1"
      RUN_COLLECTSTATIC: "0"
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      # Odblokowuje wyłącznie `manage.py e2e_timeline` (przesunięcie osi czasu etapu na potrzeby
      # scenariusza E2E). Żadnej reguły domenowej nie zmienia; w produkcji nie jest ustawiane.
      E2E_MODE: "1"
    ports:
      - "8000:8000"
  worker:
    read_only: false
    volumes:
      - ./backend:/app
  beat:
    read_only: false
    volumes:
      - ./backend:/app
  db:
    ports:
      - "5432:5432"
  minio:
    # Sieć `internal` ma internal:true, więc publikacja portu wymaga dodatkowo sieci `edge`.
    networks: [internal, edge]
    ports:
      - "9000:9000"
      - "9001:9001"
  e2e:
    # Testy end-to-end (Playwright) uruchamiane w sieci compose: docker compose -f ... --profile e2e run --rm e2e
    profiles: [e2e]
    image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    environment:
      E2E_BASE_URL: http://web:8000
      # Presigned URL-e wskazują S3_PUBLIC_ENDPOINT_URL (localhost:9000) – w sieci compose podmieniamy host.
      E2E_S3_HOST_REWRITE: "localhost:9000=minio:9000"
    networks: [internal, edge]
    depends_on:
      web: { condition: service_healthy }
      worker: { condition: service_healthy }
    command: sh -c "pip install -q -r requirements.txt && pytest -q --browser chromium"
  mailpit:
    # Jak minio: sieć `internal` ma internal:true, więc UI/API na 8025 wymaga dodatkowo `edge`.
    networks: [internal, edge]
  mail:
    # Dev używa mailpit (podgląd na :8025). Własny relay doręczałby listy naprawdę – w devie
    # nie ma po co, a bez PTR/SPF i tak psułby reputację adresu. Nienazwany profil `never`
    # wyłącza usługę z `docker compose up` przy tej nakładce.
    profiles: [never]
