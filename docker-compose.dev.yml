# Override developerski: kod z hosta montowany do kontenera, zapis dozwolony, porty pomocnicze.
# Użycie: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Każdy port publikowany WYŁĄCZNIE na 127.0.0.1 (od 1.10.2026; wcześniej na wszystkich interfejsach).
# Środowisko deweloperskie ma jawne hasła z .env.example, konta demo i E2E_MODE=1 (wyłączona CAPTCHA),
# a `"8000:8000"` publikuje port na 0.0.0.0 (na Linuksie regułami iptables Dockera, z pominięciem
# ufw) – czyli baza, MinIO z konsolą i aplikacja w trybie testowym byłyby osiągalne z sieci kawiarni
# czy biura. docker-compose.e2e-djcms.yml i mailpit w docker-compose.yml trzymają się tej samej zasady.
# Przeglądarka i narzędzia na tym samym komputerze działają bez zmian (localhost).
services:
  proxy:
    # Caddy w devie zwykle nie startuje (pracuje się na web:8000 i minio:9000 wprost), ale jeśli już –
    # też tylko na pętli zwrotnej. Bez 9000: ten port ma tu MinIO (S3_PUBLIC_ENDPOINT_URL niżej), a dwa
    # publikowane 9000 i tak by się wykluczały (z 0.0.0.0:9000 z pliku podstawowego proxy w devie nie
    # wstawało wcale).
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
  web:
    # Etap `dev` obrazu (backend/Dockerfile): runtime + ekstra `dev` (pytest, ruff…). Od 10.10.2026
    # obraz produkcyjny (`runtime`) nie ma narzędzi deweloperskich, a testy chodzą w tym kontenerze.
    # Ten sam obraz dla worker i beat – jeden build, trzy usługi (jak w pliku podstawowym).
    build:
      target: dev
      secrets: [extra_ca]
    read_only: false
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
    environment:
      DJANGO_DEBUG: "1"
      RUN_COLLECTSTATIC: "0"
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      # Odblokowuje wyłącznie `manage.py e2e_timeline` (przesunięcie osi czasu etapu na potrzeby
      # scenariusza E2E). Żadnej reguły domenowej nie zmienia; w produkcji nie jest ustawiane.
      E2E_MODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build:
      target: dev
      secrets: [extra_ca]
    read_only: false
    volumes:
      - ./backend:/app
  beat:
    build:
      target: dev
      secrets: [extra_ca]
    read_only: false
    volumes:
      - ./backend:/app
  db:
    ports:
      - "127.0.0.1:5432:5432"
  minio:
    # Sieć `internal` ma internal:true, więc publikacja portu wymaga dodatkowo sieci `edge`.
    networks: [internal, edge]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
  e2e:
    # Testy end-to-end (Playwright) uruchamiane w sieci compose: docker compose -f ... --profile e2e run --rm e2e
    profiles: [e2e]
    image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    environment:
      E2E_BASE_URL: http://web:8000
      # Presigned URL-e wskazują S3_PUBLIC_ENDPOINT_URL (localhost:9000) – w sieci compose podmieniamy host.
      E2E_S3_HOST_REWRITE: "localhost:9000=minio:9000"
    networks: [internal, edge]
    depends_on:
      web: { condition: service_healthy }
      worker: { condition: service_healthy }
    command: sh -c "pip install -q -r requirements.txt && pytest -q --browser chromium"
  mailpit:
    # Jak minio: sieć `internal` ma internal:true, więc UI/API na 8025 wymaga dodatkowo `edge`.
    networks: [internal, edge]
  mail:
    # Dev używa mailpit (podgląd na :8025). Własny relay doręczałby listy naprawdę – w devie
    # nie ma po co, a bez PTR/SPF i tak psułby reputację adresu. Nienazwany profil `never`
    # wyłącza usługę z `docker compose up` przy tej nakładce.
    profiles: [never]
  djcms:
    # Wersja porównawcza na django CMS (docs/tasks/DJ-01.md): runserver na http://localhost:8100,
    # kod z hosta i `backend/static` montowane na żywo. Wstaje wyłącznie z `--profile djcms`:
    #   bash scripts/djcms_db.sh --allow-createdb
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile djcms up -d --build djcms
    build:
      # Etap `dev` (runtime + ekstra `dev`) – jak web wyżej. Opcjonalny certyfikat CA dla TLS
      # w czasie budowania (antywirus przechwytujący HTTPS) – patrz `secrets:` na końcu pliku
      # i komentarz w djcms/Dockerfile.
      target: dev
      secrets: [extra_ca]
    read_only: false
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJCMS_DEBUG: "1"
      DJCMS_ALLOWED_HOSTS: localhost,127.0.0.1,djcms
      DJCMS_CSRF_TRUSTED_ORIGINS: http://localhost:8100
      DJCMS_MAIN_MEDIA_ORIGIN: http://localhost:9000
    volumes:
      - ./djcms:/app
      - ./backend/static:/opt/shared_static:ro
      # Kontrakt tras aplikacji głównej (DJ-02 § 6) na żywo – obraz produkcyjny ma go skopiowanego.
      - ./backend/djcms_contract:/opt/djcms_contract:ro
      - djcms_media:/app/media
    ports:
      - "127.0.0.1:8100:8000"
    # Jak minio: publikacja portu wymaga sieci nie-`internal`.
    networks: [internal, edge]

# Sekret BuildKit `extra_ca` dla obrazów djcms i web (etap `dev`). `EXTRA_CA_FILE` w `.env` wskazuje plik PEM z dodatkowym
# CA (np. Norton, który podpisuje przechwycony HTTPS i psuje `uv sync` błędem `UnknownIssuer`).
# Nieustawiona = pusty plik z repozytorium, czyli zwykły magazyn CA obrazu. Certyfikat nie trafia
# do obrazu ani do repozytorium – istnieje wyłącznie w czasie jednego kroku budowania.
secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-./djcms/docker/no-extra-ca.pem}
